          variable: granularity
        - value_selector: [start, scope_selection]
          variable: scope_selection
        - value_selector: [start, view_economic]
          variable: view_economic
        - value_selector: [start, view_ability]
          variable: view_ability
        - value_selector: [start, economic_config]
          variable: economic_config
        - value_selector: [start, art_innovation]
          variable: art_innovation
        - value_selector: [start, art_decision]
          variable: art_decision
        - value_selector: [start, art_problem]
          variable: art_problem
        - value_selector: [start, art_collaboration]
          variable: art_collaboration
        - value_selector: [start, art_team]
          variable: art_team
        - value_selector: [start, art_negotiation]
          variable: art_negotiation
        - value_selector: [start, art_technology]
          variable: art_technology
        - value_selector: [start, art_environment]
          variable: art_environment
        - value_selector: [start, art_professional]
          variable: art_professional
        - value_selector: [start, weight_think]
          variable: weight_think
        - value_selector: [start, weight_relationship]
          variable: weight_relationship
        - value_selector: [start, weight_action]
          variable: weight_action
        - value_selector: [start, weight_economic]
          variable: weight_economic
        - value_selector: [start, weight_ability]
          variable: weight_ability
