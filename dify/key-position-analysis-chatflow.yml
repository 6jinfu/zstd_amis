    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 双视角同时计算经济象限、能力象限和综合象限，并识别冲突。
        memory:
          query_prompt_template: |-
            配置：
            {{#prepare.config#}}

            岗位与供需材料：
            {{#extract.text#}}

            用户当前消息：{{#sys.query#}}
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 20
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen3.6-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: key-dual-system
          role: system
          text: |-
            你是关键岗位诊断的E+A双视角引擎。只基于材料和配置执行：
            1. 经济E：计算或判断需求N与供给S；需求高×供给少为关键建议。
            2. 能力A：仅按启用的ART九变量1～3分锚定，结合归一组权重得到ART；再判断时间成本；能力高×时间成本高为关键建议。
            3. 综合：按配置视角权重汇总关键系数；供需比高×ART高为最关键建议。
            4. E与A结论不一致必须标记suggest_calibrate=true，不能偷偷平均掉冲突。

            输出保持前台简单：
            ### 配置确认
            ### 一句话结论
            ### 经济E象限结果（岗位/岗位族、N、S、象限、证据）
            ### 能力A象限结果（ART明细、时间成本、象限、证据）
            ### 综合排序（关键系数、是否达到建议阈值、置信度）
            ### 建议校准
            ### 管理员确认清单
            ### 你可以继续问

            末尾必须追加一个供服务端解析、但不展示给用户的HTML注释块：
            `<!-- RESULT_JSON {合法JSON} -->`，包含schema_version、economic_results、ability_results、combined_results、calibration_items。JSON中不得加入注释或Markdown。
            分析颗粒度可按岗位族呈现，但任何“标记为关键”的候选必须下钻到具体岗位。所有是否关键均为AI建议，不得自动写is_key=true。
            数据不足时标记data_insufficient，不得编造市场供给、培养周期或评分。B/R/S禁止执行。
        selected: false
        title: E+A 双视角综合分析
        type: llm
        variables: []
        vision:
          enabled: false
