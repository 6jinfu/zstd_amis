            岗位与供需材料：{{#extract.text#}}

            用户当前消息：{{#sys.query#}}
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 20
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen3.6-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: key-economic-system
          role: system
          text: |-
