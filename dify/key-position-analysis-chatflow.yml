    - data:
        code: |-
          def main(project_name, analysis_goal, org_version, granularity, scope_selection,
                   view_economic, view_ability, economic_config,
                   art_innovation, art_decision, art_problem,
                   art_collaboration, art_team, art_negotiation,
                   art_technology, art_environment, art_professional,
                   weight_think, weight_relationship, weight_action,
                   weight_economic, weight_ability, key_threshold):
              errors = []
              if not str(org_version or "").strip():
                  errors.append("必须引用一个已生效的组织结构版本")
              if not str(scope_selection or "").strip():
                  errors.append("必须填写已选岗位族或具体岗位")
              if not view_economic and not view_ability:
                  errors.append("经济E与能力A至少选择一个视角")
              threshold = float(key_threshold)
              if threshold < 0 or threshold > 1:
                  errors.append("关键系数阈值必须在0～1之间")

              art_vars = [name for enabled, name in [
                  (art_innovation, "思考-创新"), (art_decision, "思考-决策"),
                  (art_problem, "思考-问题"), (art_collaboration, "关系-协同"),
                  (art_team, "关系-团队"), (art_negotiation, "关系-谈判"),
                  (art_technology, "行动-技术"), (art_environment, "行动-环境"),
                  (art_professional, "行动-专业")]
                  if enabled]
              art_total = float(weight_think or 0) + float(weight_relationship or 0) + float(weight_action or 0)
              if view_ability and not art_vars:
                  errors.append("选择能力A时，至少启用一个ART变量")
              if view_ability and art_total <= 0:
                  errors.append("ART三组权重合计必须大于0")
              art_weights = "未启用"
              if art_total > 0:
                  art_weights = (f"思考:{round(float(weight_think)/art_total*100,2)}%；"
                                 f"关系:{round(float(weight_relationship)/art_total*100,2)}%；"
                                 f"行动:{round(float(weight_action)/art_total*100,2)}%")

              if view_economic and view_ability:
                  view_mode = "E+A"
                  view_total = float(weight_economic or 0) + float(weight_ability or 0)
                  if view_total <= 0:
                      errors.append("双视角权重合计必须大于0")
                      view_weights = "无效"
                  else:
                      view_weights = (f"经济E:{round(float(weight_economic)/view_total*100,2)}%；"
                                      f"能力A:{round(float(weight_ability)/view_total*100,2)}%")
              elif view_economic:
                  view_mode = "E"
                  view_weights = "经济E:100%"
              else:
                  view_mode = "A"
                  view_weights = "能力A:100%"

              config = "\n".join([
                  f"项目：{project_name}",
                  f"分析目标：{analysis_goal or '未填写'}",
                  f"引用组织结构版本：{org_version}",
                  f"分析颗粒度：{granularity}",
                  f"已选岗位族/岗位：{scope_selection}",
                  f"所选视角：{view_mode}",
                  f"视角归一权重：{view_weights}",
                  f"经济E数据来源说明：{economic_config or '平台岗位数据+编制/缺口+业务权重；供给数据缺失时标记待补充'}",
                  f"能力A启用ART变量：{'、'.join(art_vars) or '未启用'}",
                  f"ART归一权重：{art_weights}",
                  f"关键系数建议阈值：{threshold}",
                  "B/R/S状态：即将上线，本次禁止执行"])
              return {
                  "config": config,
                  "validation_error": "；".join(errors),
                  "view_mode": view_mode,
                  "key_threshold": threshold}
        code_language: python3
        desc: 校验组织版本、范围、视角和阈值，并归一ART及多视角权重。
        outputs:
          config:
            children: null
            type: string
          key_threshold:
