      - .CSV
      - .TXT
      - .MD
      allowed_file_types:
      - document
      - custom
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 10
        file_size_limit: 30
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 10
    opening_statement: |-
      你好，我是关键岗位分析助手。

      请完成岗位范围和分析视角配置，并提交岗位与供需材料。我会从岗位需求、人才供给、能力要求和培养时间等方面形成关键度判断。

      分析结果仅作为决策依据，最终是否标记为关键岗位需要管理员确认。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 展开某个岗位的经济E评分依据
    - 展开某个岗位的ART九变量评分
    - 列出多视角结论不一致、需要人工校准的岗位
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
