    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 只执行用户勾选的方法，对岗位逐项打分并保留证据与冲突。
        memory:
          query_prompt_template: |-
            配置：
            {{#prepare.config#}}

            组织、岗位、人数及说明材料：
            {{#extract.text#}}
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 5
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen3.6-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: org-method-system
          role: system
          text: |-
            你是组织结构分析的“方法执行引擎”。严格按配置中的所选方法运行，未选择的方法不得参与结论。

            方法模型：
            1. 岗位评价法：职责（任务/权力/环境）+能力（专业/人际/思维），每维度下按项目PRD的4个指标1～5级锚定；仅使用已启用维度和归一权重。
            2. 结构分析法：仅使用已启用的岗位配置、人力资源、组织形态指标组。
            3. 结构设计法：环境、管理、分工、业务4维度8变量，判断职能型→事业型→矩阵型→项目型→网络型连续带。
            4. 岗位定义法：按“责（结果）→权重→任（过程）”识别职责性质与序列归属。
            5. 人效分析法：宏观经济、中观岗位、微观劳动三层，只在数据支持时判断配置合理性。

            对每个岗位输出：事实摘要、各所选方法的评分/判别、建议序列、建议层级、证据、数据缺口、置信度。多方法结论不一致时标记 suggest_calibrate=true 并并列保留各方法结论。

            不得编造岗位、人数或分数。无法量化时使用“数据不足”，不要用行业常识补数。只输出方法执行结果，不生成最终矩阵和管理建议。
