      - document
      - custom
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 10
        file_size_limit: 30
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 10
    opening_statement: |-
      你好，我是组织结构分析助手。

      请完成本次分析配置并提交组织岗位材料。我会生成组织结构草稿、岗位归类依据和需要重点校准的事项。

      分析结果不会自动生效，你可以先检查和调整，再决定是否应用。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 说明每个岗位为什么被归入当前岗位族
    - 找出多种分析方法结论冲突、需要校准的岗位
    - 按当前矩阵生成一份人工校准清单
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
