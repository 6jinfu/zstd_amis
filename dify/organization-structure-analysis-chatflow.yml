    - data:
        code: |-
          def main(project_name, scope_mode, scope_selection, analysis_goal,
                   method_job_evaluation, method_structure_analysis,
                   method_structure_design, method_job_definition, method_efficiency,
                   method_priority, dim_task, dim_power, dim_environment,
                   dim_professional, dim_interpersonal, dim_thinking,
                   weight_task, weight_power, weight_environment,
                   weight_professional, weight_interpersonal, weight_thinking,
                   structure_position, structure_people, structure_form,
                   other_method_config, sequence_count, level_count,
                   sequence_names, level_names, classify_mode):
              methods = []
              for selected, name in [
                  (method_job_evaluation, "岗位评价法"),
                  (method_structure_analysis, "结构分析法"),
                  (method_structure_design, "结构设计法"),
                  (method_job_definition, "岗位定义法"),
                  (method_efficiency, "人效分析法")]:
                  if selected:
                      methods.append(name)

              errors = []
              if not str(scope_selection or "").strip():
                  errors.append("必须填写已选部门/岗位的名称或ID")
              if not methods:
                  errors.append("至少选择一种分析方法")
              if not (2 <= int(sequence_count) <= 6 and 2 <= int(level_count) <= 6):
                  errors.append("序列数和层级数必须在2～6之间")

              dim_pairs = [
                  (dim_task, "任务", weight_task),
                  (dim_power, "权力", weight_power),
                  (dim_environment, "环境", weight_environment),
                  (dim_professional, "专业", weight_professional),
                  (dim_interpersonal, "人际", weight_interpersonal),
                  (dim_thinking, "思维", weight_thinking)]
              active_dims = [(name, float(weight or 0)) for enabled, name, weight in dim_pairs if enabled]
              if method_job_evaluation and not active_dims:
                  errors.append("选择岗位评价法时，至少启用一个岗评维度")
              total = sum(weight for _, weight in active_dims)
              normalized = []
              if active_dims and total > 0:
                  normalized = [f"{name}:{round(weight / total * 100, 2)}%" for name, weight in active_dims]
              elif method_job_evaluation:
                  errors.append("岗位评价法启用维度的权重合计必须大于0")

              structure_dims = [name for enabled, name in [
                  (structure_position, "岗位配置（人数/岗位数/人岗比/空岗率）"),
                  (structure_people, "人力资源（年限/学历/绩效/薪酬）"),
                  (structure_form, "组织形态（分工/分权/分配/发展）")]
                  if enabled]
              if method_structure_analysis and not structure_dims:
                  errors.append("选择结构分析法时，至少启用一个结构分析指标组")

              config = "\n".join([
                  f"项目/版本：{project_name}",
                  f"组织范围模式：{scope_mode}",
                  f"已选部门/岗位：{scope_selection}",
                  f"分析目标：{analysis_goal or '未填写'}",
                  f"所选分析方法：{'、'.join(methods) or '无'}",
                  f"多方法整合优先级：{method_priority}",
                  f"岗位评价法启用维度及归一权重：{'、'.join(normalized) or '未启用'}",
                  f"结构分析法启用指标组：{'、'.join(structure_dims) or '未启用'}",
                  f"其他方法配置：{other_method_config or '采用项目PRD默认模型'}",
                  f"宫格规格：{int(sequence_count)}序列 × {int(level_count)}层级",
                  f"序列名称：{sequence_names or '由AI建议'}",
                  f"层级名称：{level_names or '由AI建议'}",
                  f"归类模式：{classify_mode}"])
              return {
                  "config": config,
                  "validation_error": "；".join(errors),
                  "selected_methods": "、".join(methods),
                  "grid_spec": f"{int(sequence_count)}×{int(level_count)}",
                  "mode": str(classify_mode)}
        code_language: python3
        desc: 校验原型必填规则，并将多选方法、维度和权重转换为模型可执行配置。
