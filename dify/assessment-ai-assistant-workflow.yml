              return {'standardId': ctx['standard']['id'], 'standardName': ctx['standard']['name'],
                  'sourceVersion': ctx['standard']['version'], 'entry': ctx['entry'],
                  'scope': ctx['scope'], 'scopeLabel': ctx['scope_label'], 'purpose': ctx['purpose'],
                  'scenario': ctx['scenario'], 'counts': ctx['counts'], 'selectedAbilities': ctx['selected_abilities']}

          def card(ctx):
              return {'type': 'assessment_confirmation',
                  'abilities': [{'value': a['name'], 'label': a['name'], 'level': a['level'], 'checked': a['name'] in ctx['selected_abilities']} for a in ctx['abilities']],
                  'counts': ctx['counts'], 'scenario': ctx['scenario'], 'supplement_optional': True,
                  'total_questions': len(ctx['selected_abilities']) * sum(ctx['counts'].values()),
                  'confirm_action': 'generate_questionnaire'}

          def main(context_json, model):
              ctx = json.loads(context_json)
              if model.get('status') != 'ready':
                  questions = model.get('questions', [])
                  if not names(questions, 1000, 5) or not questions:
                      questions = ['请说明具体场景或题数；能力可直接在对话卡片中勾选。']
                  return emit(ctx, 'needs_clarification', questions[0], questions=questions)
              if model.get('questions'):
                  return emit(ctx, 'needs_clarification', '本次调整仍有内容需要说明。', questions=model['questions'])
              changes = model.get('counts_changes', {})
              if not isinstance(changes, dict) or set(changes) != set(TYPES) or any(type(v) is not int or not -1 <= v <= 5 for v in changes.values()):
                  return emit(ctx, 'invalid', '调整结果中的题数不合法。')
              changed = []
              for kind, value in changes.items():
                  if value != -1 and value != ctx['counts'][kind]:
                      ctx['counts'][kind] = value
                      changed.append(kind)
              has_scenario = model.get('has_scenario_change')
              if type(has_scenario) is not bool:
                  return emit(ctx, 'invalid', '场景调整标记不合法。')
              if has_scenario:
                  if not text(model.get('scenario'), 3000):
                      return emit(ctx, 'needs_clarification', '请补充具体评估场景。')
                  if ctx['scenario'] != model['scenario']:
                      ctx['scenario'] = model['scenario']
                      changed.append('scenario')
              if not changed:
                  return emit(ctx, 'needs_clarification', '当前配置没有变化，请说明具体调整方向。')
              if not sum(ctx['counts'].values()):
                  return emit(ctx, 'needs_clarification', '至少需要一种题型大于0，请调整题数。')
              replacing = ctx['phase'] == 'draft' or ctx['questionnaire_version'] > 0
              return emit(ctx, 'replacement_required' if replacing else 'ok',
                  '按此调整重新生成将替换当前问卷，请确认。' if replacing else '已更新本次生成配置。',
                  review=config_view(ctx), changed_fields=changed, ui=card(ctx), requires_replace_confirmation=replacing)
