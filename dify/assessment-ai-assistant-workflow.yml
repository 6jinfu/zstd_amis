          def dump(value):
              return json.dumps(value, ensure_ascii=False, allow_nan=False, separators=(',', ':'))

          def text(value, limit=3000):
              return isinstance(value, str) and bool(value.strip()) and len(value) <= limit

          def names(value, limit=120, maximum=100):
              return isinstance(value, list) and len(value) <= maximum and all(text(x, limit) for x in value) and len(value) == len(set(value))

          def counts_valid(value):
              return isinstance(value, dict) and set(value) == set(TYPES) and all(type(x) is int and 0 <= x <= 5 for x in value.values())

          def emit(ctx, status, reply, **extra):
              result = {'schema_version': '1.0', 'action': ctx.get('action', ''),
                  'request_id': ctx.get('request_id', ''), 'session_id': ctx.get('session_id', ''),
                  'status': status, 'reply': reply, 'issues': [], 'can_create': False,
                  'base_questionnaire_version': ctx.get('questionnaire_version', 0)}
              result.update(extra)
              encoded = dump(result)
              if len(encoded) > 70000:
                  encoded = dump({'schema_version': '1.0', 'status': 'invalid', 'action': ctx.get('action', ''),
                      'request_id': ctx.get('request_id', ''), 'session_id': ctx.get('session_id', ''),
                      'reply': '标准上下文过长，请筛选所需资料后重试。', 'issues': ['结果元数据超过70000字'], 'can_create': False})
              return {'result_json': encoded, 'question_batches': []}

          def config_view(ctx):
              return {'standardId': ctx['standard']['id'], 'standardName': ctx['standard']['name'],
                  'sourceVersion': ctx['standard']['version'], 'entry': ctx['entry'],
                  'scope': ctx['scope'], 'scopeLabel': ctx['scope_label'], 'purpose': ctx['purpose'],
                  'scenario': ctx['scenario'], 'counts': ctx['counts'], 'selectedAbilities': ctx['selected_abilities']}

          def card(ctx):
              return {'type': 'assessment_confirmation',
                  'abilities': [{'value': a['name'], 'label': a['name'], 'level': a['level'], 'checked': a['name'] in ctx['selected_abilities']} for a in ctx['abilities']],
                  'counts': ctx['counts'], 'scenario': ctx['scenario'], 'supplement_optional': True,
                  'total_questions': len(ctx['selected_abilities']) * sum(ctx['counts'].values()),
                  'confirm_action': 'generate_questionnaire'}

          def main(context_json, batches):
              ctx = json.loads(context_json)
              errors, questions = [], []
              if not isinstance(batches, list) or len(batches) != len(ctx['selected_abilities']):
                  return emit(ctx, 'invalid', '问卷不完整，未替换当前内容。', issues=['能力批次数量不符'])
              for index, raw in enumerate(batches):
                  try:
                      batch = json.loads(raw)
                  except (ValueError, TypeError):
                      return emit(ctx, 'invalid', '问卷结果格式不完整。', issues=['能力批次JSON不合法'])
                  if not isinstance(batch, dict) or batch.get('ability') != ctx['selected_abilities'][index] or batch.get('valid') is not True:
                      errors.append('能力批次校验失败：' + ctx['selected_abilities'][index])
                      if isinstance(batch, dict):
                          errors.extend(batch.get('issues', []))
                      continue
                  questions.extend(batch['questions'])
              if errors:
                  return emit(ctx, 'invalid', '部分题目未通过校验，未替换当前问卷。', issues=errors)
              total = len(ctx['selected_abilities']) * sum(ctx['counts'].values())
              if len(questions) != total or len({q['id'] for q in questions}) != total:
                  return emit(ctx, 'invalid', '问卷数量或题目编号不合法。', issues=['问卷数量或编号重复'])
              signatures = [re.sub(r'[\W_]+', '', q['text']).lower() for q in questions]
              if len(signatures) != len(set(signatures)):
                  return emit(ctx, 'invalid', '问卷中有重复题干，请重新生成。', issues=['跨能力题干重复'])
              turns = copy.deepcopy(ctx['turns'])
              turns.append({'role': 'assistant', 'text': '已按 ' + str(len(ctx['selected_abilities'])) + ' 项能力生成 ' + str(total) + ' 道题。'})
              editor_base = {'title': ctx['title'], 'standardId': ctx['standard']['id'], 'standardName': ctx['standard']['name'],
                  'scope': ctx['scope'], 'scopeLabel': ctx['scope_label'], 'sourceContent': ctx['standard']['content'],
                  'purpose': ctx['purpose'], 'scenario': ctx['scenario'], 'counts': ctx['counts'], 'turns': turns}
              result = emit(ctx, 'ok', '问卷已生成，可查看内容或创建问卷。', can_create=True,
                  review=config_view(ctx), question_count=total, proposed_questionnaire_version=ctx['questionnaire_version'] + 1,
                  editor_base=editor_base, editor_path='assess-new.html?ai=1',
                  source_snapshot={'standard_id': ctx['standard']['id'], 'version': ctx['standard']['version'], 'scope': ctx['source_scope']},
                  ui={'type': 'questionnaire', 'ability_order': ctx['selected_abilities'],
                      'actions': [{'id': 'create_questionnaire', 'label': '创建问卷', 'requires_model': False}]})
              if json.loads(result['result_json'])['can_create']:
                  result['question_batches'] = batches
              return result
