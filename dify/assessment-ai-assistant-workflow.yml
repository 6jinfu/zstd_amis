      targetPosition: left
      data:
        type: code
        title: 逐题校验并绑定来源能力
        desc: ''
        selected: false
        code: |-
          import copy
          import hashlib
          import json
          import re

          TYPES = ['single', 'multi', 'score', 'essay']
          DEFAULT_COUNTS = {'single': 3, 'multi': 1, 'score': 1, 'essay': 1}

          def dump(value):
              return json.dumps(value, ensure_ascii=False, allow_nan=False, separators=(',', ':'))

          def text(value, limit=3000):
              return isinstance(value, str) and bool(value.strip()) and len(value) <= limit

          def names(value, limit=120, maximum=100):
              return isinstance(value, list) and len(value) <= maximum and all(text(x, limit) for x in value) and len(value) == len(set(value))

          def counts_valid(value):
              return isinstance(value, dict) and set(value) == set(TYPES) and all(type(x) is int and 0 <= x <= 5 for x in value.values())

          def emit(ctx, status, reply, **extra):
              result = {'schema_version': '1.0', 'action': ctx.get('action', ''),
                  'request_id': ctx.get('request_id', ''), 'session_id': ctx.get('session_id', ''),
                  'status': status, 'reply': reply, 'issues': [], 'can_create': False,
                  'base_questionnaire_version': ctx.get('questionnaire_version', 0)}
              result.update(extra)
              encoded = dump(result)
              if len(encoded) > 70000:
                  encoded = dump({'schema_version': '1.0', 'status': 'invalid', 'action': ctx.get('action', ''),
                      'request_id': ctx.get('request_id', ''), 'session_id': ctx.get('session_id', ''),
                      'reply': '标准上下文过长，请筛选所需资料后重试。', 'issues': ['结果元数据超过70000字'], 'can_create': False})
              return {'result_json': encoded, 'question_batches': []}

          def config_view(ctx):
              return {'standardId': ctx['standard']['id'], 'standardName': ctx['standard']['name'],
                  'sourceVersion': ctx['standard']['version'], 'entry': ctx['entry'],
                  'scope': ctx['scope'], 'scopeLabel': ctx['scope_label'], 'purpose': ctx['purpose'],
                  'scenario': ctx['scenario'], 'counts': ctx['counts'], 'selectedAbilities': ctx['selected_abilities']}

          def card(ctx):
              return {'type': 'assessment_confirmation',
                  'abilities': [{'value': a['name'], 'label': a['name'], 'level': a['level'], 'checked': a['name'] in ctx['selected_abilities']} for a in ctx['abilities']],
                  'counts': ctx['counts'], 'scenario': ctx['scenario'], 'supplement_optional': True,
                  'total_questions': len(ctx['selected_abilities']) * sum(ctx['counts'].values()),
                  'confirm_action': 'generate_questionnaire'}

          def main(job, model):
              errors, questions, metadata = [], [], []
              rows = model.get('questions') if isinstance(model, dict) else None
              if not isinstance(rows, list) or len(rows) != sum(job['counts'].values()):
                  errors.append('当前能力的题目总数不符合配置')
                  rows = rows if isinstance(rows, list) else []
              actual = {key: 0 for key in TYPES}
              seen = set()
              for row in rows:
                  if not isinstance(row, dict):
                      errors.append('题目必须为对象')
                      continue
                  kind = row.get('type')
                  if kind not in TYPES:
                      errors.append('包含非法题型')
                      continue
                  actual[kind] += 1
                  body = row.get('text')
                  behavior = row.get('behavior')
                  options = row.get('options')
                  if not text(body, 500) or not text(behavior, 300):
                      errors.append('题干或行为依据为空或超长')
                      continue
                  signature = re.sub(r'[\W_]+', '', body).lower()
                  if signature in seen:
                      errors.append('当前能力包含重复题干')
                  seen.add(signature)
                  if kind in ['single', 'multi']:
                      if not names(options, 300, 6) or len(options) < 2:
                          errors.append('选择题必须有2至6个非空且无重复的选项')
                          continue
                  elif options != []:
                      errors.append('打分题和问答题不接受自定义选项')
                      continue
                  index = actual[kind]
                  stable = dump([job['request_id'], job['standard_id'], job['ability'], kind, index])
                  question_id = 'q-' + hashlib.sha256(stable.encode()).hexdigest()[:20]
                  questions.append({'id': question_id, 'ability': job['ability'], 'type': kind, 'text': body.strip(), 'options': options})
                  metadata.append({'question_id': question_id, 'standard_id': job['standard_id'], 'standard_version': job['standard_version'],
                      'ability': job['ability'], 'required_level': job['level'], 'behavior': behavior,
                      'level_basis': 'provided_definition' if job['level_definition'] else 'standard_level_only'})
              if actual != job['counts']:
                  errors.append('当前能力的各题型数量不符合配置')
              result = {'ability': job['ability'], 'valid': not errors, 'issues': list(dict.fromkeys(errors)),
                  'questions': questions if not errors else [], 'question_metadata': metadata if not errors else []}
              encoded = dump(result)
              if len(encoded) > 70000:
                  encoded = dump({'ability': job['ability'], 'valid': False, 'issues': ['单项能力输出过长'], 'questions': [], 'question_metadata': []})
              return {'batch_json': encoded}
        code_language: python3
        variables:
        - variable: job
          value_selector:
          - per_ability
          - item
        - variable: model
          value_selector:
          - question_llm
          - structured_output
        outputs:
          batch_json:
            type: string
            children: null
        isInIteration: true
        iteration_id: per_ability
      parentId: per_ability
      zIndex: 1002
