app:
  description: 生成设置→五档偏好→平台词典优先匹配/新能力建议→排序评分→全等级草稿→范围及新能力确认→编辑保存。
  icon: 🧭
  icon_background: '#DCE7FF'
  mode: workflow
  name: 人才发展｜人才标准 AI 帮建（1127版）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: true
      allowed_file_extensions:
      - .PDF
      - .DOCX
      - .XLSX
      - .CSV
      - .TXT
      - .MD
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      number_limits: 10
      fileUploadConfig:
        file_size_limit: 30
        batch_count_limit: 10
        workflow_file_upload_limit: 10
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 480
      positionAbsolute:
        x: 0
        y: 480
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: start
        title: 动作与业务会话状态
        desc: 动作由业务代码传入；步骤与当前人才标准原型一致。
        selected: false
        variables:
        - variable: action
          label: 本次动作
          type: select
          required: true
          default: analyze_brief
          options:
          - analyze_brief
          - confirm_settings
          - prepare_capabilities
          - confirm_sort
          - generate_draft
          - revise_draft
          - suggest_similar_positions
          - prepare_apply
          max_length: 32
        - variable: payload_json
          label: 当前页面状态JSON
          type: paragraph
          required: true
          max_length: 120000
          default: '{"request_id": "example-1127", "session_id": "example-session", "phase": "welcome", "operation": "new",
            "draft_version": 0, "user_message": "建立能独立完成工作交付的通用人才标准，先整理职责和经历。", "enabled_sections": ["duty", "exp", "cap",
            "pow", "pot"], "selected_sections": ["duty", "exp"], "brief": {}, "catalog": {"version": "example-v1", "positions":
            [], "categories": [{"id": "general", "name": "通用标准"}], "cap": [], "pow": [], "pot": []}, "reference_context":
            []}'
        - variable: reference_files
          label: 新增参考资料（仅整理建模信息时）
          type: file-list
          required: false
          max_length: 10
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .PDF
          - .DOCX
          - .XLSX
          - .CSV
          - .TXT
          - .MD
          allowed_file_upload_methods:
          - local_file
          - remote_url
    - id: normalize
      type: custom
      position:
        x: 350
        y: 480
      positionAbsolute:
        x: 350
        y: 480
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: code
        title: 校验阶段、确认、版本与词典
        desc: 1127流程；业务服务控制会话、权限与最终保存。
        selected: false
        code_language: python3
        code: "import copy\n\nimport hashlib\n\nimport json\n\nimport re\n\nSECTIONS = ['duty', 'exp', 'cap', 'pow', 'pot']\n\
          \nDETAILS = {'concise': 6, 'essential': 10, 'regular': 14, 'expanded': 18, 'detailed': 20}\n\nSTRUCTURES = ['behavior',\
          \ 'context_behavior', 'context_behavior_result']\n\nPHASES = {\n    'analyze_brief': ['welcome', 'review'], 'confirm_settings':\
          \ ['review'],\n    'prepare_capabilities': ['outline'], 'confirm_sort': ['rank'],\n    'generate_draft': ['outline',\
          \ 'compare'], 'revise_draft': ['scope'],\n    'suggest_similar_positions': ['scope'], 'prepare_apply': ['scope'],\n\
          }\n\ndef dump(value):\n    return json.dumps(value, ensure_ascii=False, allow_nan=False, separators=(',', ':'))\n\
          \ndef text(value, maximum=3000):\n    return isinstance(value, str) and bool(value.strip()) and len(value) <= maximum\n\
          \ndef require(condition, message):\n    if not condition:\n        raise ValueError(message)\n\ndef fingerprint(value):\n\
          \    return hashlib.sha256(json.dumps(value, ensure_ascii=False, sort_keys=True, allow_nan=False).encode()).hexdigest()\n\
          \ndef component(kind, data):\n    return {'type': kind, 'version': '1.0', 'data': data}\n\ndef result(ctx, status,\
          \ reply, components=None, **extra):\n    value = dict(schema_version='3.0', action=ctx.get('action', ''), request_id=ctx.get('request_id',\
          \ ''),\n                 session_id=ctx.get('session_id', ''), phase=ctx.get('phase', ''),\n                 base_draft_version=ctx.get('draft_version',\
          \ 0), catalog_version=ctx.get('catalog', {}).get('version', ''),\n                 source_standard_id=ctx.get('source_standard',{}).get('id',''),source_standard_version=ctx.get('source_standard',{}).get('version',''),\n\
          \                 status=status, reply=reply, can_apply=False, components=components or [],\n                 service_requests=[],\
          \ issues=[], draft=None)\n    value.update(extra)\n    return {'result_json': dump(value)}\n\ndef catalog_map(ctx,\
          \ kind):\n    return {item['id']: item for item in ctx['catalog'].get(kind, [])}\n\ndef levels_of(item):\n    values\
          \ = [row['level'] for row in item.get('levels', [])]\n    require(values and len(values) <= 10 and len(set(values))\
          \ == len(values)\n            and all(isinstance(v, str) and re.fullmatch(r'L(?:10|[1-9])', v) for v in values),\
          \ '能力等级须为平台已配置且不重复的L1–L10')\n    return values\n\ndef generation_key(ctx):\n    return fingerprint({key: ctx.get(key)\
          \ for key in ['session_id', 'operation', 'brief', 'user_message', 'selected_sections',\n        'generation_preferences',\
          \ 'reference_context', 'source_standard']} | {'catalog_version': ctx['catalog']['version']})\n\ndef checked_bundle(ctx):\n\
          \    bundle = ctx.get('capability_bundle', {})\n    require(isinstance(bundle, dict) and isinstance(bundle.get('items'),\
          \ list), '缺少能力候选快照')\n    require(bundle.get('context_key') == generation_key(ctx), '生成设置、偏好、词典或来源已变化，请重新生成能力候选')\n\
          \    items = bundle['items']\n    require(bundle.get('token') == fingerprint([bundle['context_key'], items]), '能力候选快照不一致')\n\
          \    require(0 < len(items) <= DETAILS[ctx['generation_preferences']['detail']], '能力候选数量不符合详略上限')\n    require(len({item['id']\
          \ for item in items}) == len(items), '能力候选ID重复')\n    catalog = catalog_map(ctx, 'cap')\n    for item in items:\n\
          \        require(text(item.get('radar_name'), 80), '缺少雷达图名称')\n        require(type(item.get('suggested_score'))\
          \ is int and 1 <= item['suggested_score'] <= 5, '建议重要性分须为1–5整数')\n        if item.get('source') == 'catalog':\n\
          \            require(item['id'] in catalog and item['name'] == catalog[item['id']]['name'], '已有能力不在本次词典候选中')\n \
          \           require(item['levels'] == levels_of(catalog[item['id']]), '能力等级配置已变化')\n        else:\n            require(item.get('source')\
          \ == 'generated' and item['id'].startswith('proposal-'), '生成能力身份不合法')\n            require(item.get('dimension')\
          \ in ctx['catalog'].get('ability_dimensions', []), '新能力维度不存在')\n            require(item.get('category_name') ==\
          \ 'AI 生成', '新能力默认类别须为AI 生成')\n            require(item['levels'] == ctx['catalog'].get('new_capability_levels'),\
          \ '缺少新能力的平台等级配置')\n    return items\n\ndef sorted_items(ctx, with_ratings=False):\n    items = checked_bundle(ctx)\n\
          \    order = ctx.get('sorted_capability_ids', [])\n    require(ctx.get('sort_confirmed') is True and isinstance(order,\
          \ list)\n            and len(order) == len(items) and len(set(order)) == len(order)\n            and set(order)\
          \ == {item['id'] for item in items}, '请确认完整且无重复的能力排序')\n    by_id = {item['id']: item for item in items}\n    ordered\
          \ = [by_id[key] for key in order]\n    if with_ratings:\n        ratings = ctx.get('importance_scores', {})\n  \
          \      require(ctx.get('ratings_confirmed') is True and isinstance(ratings, dict) and set(ratings) == set(order)\n\
          \                and all(type(score) is int and 1 <= score <= 5 for score in ratings.values()), '请确认每项能力的1–5分重要性评分')\n\
          \        ordered.sort(key=lambda item: -ratings[item['id']])\n    return ordered\n\ndef content_errors(ctx, draft):\n\
          \    require(isinstance(draft, dict) and isinstance(draft.get('content'), dict), '缺少完整标准草稿')\n    content = draft['content']\n\
          \    require(set(content) == set(SECTIONS) and all(isinstance(content[k], list) for k in SECTIONS), '草稿须含五类内容数组')\n\
          \    require(len(content['cap']) <= 20, '每套标准最多20项能力')\n    requirements = draft.get('capability_requirements',\
          \ [])\n    require(len(content['cap']) == len(requirements), '能力要求与等级描述记录不一致')\n    ids = [item['id'] for item in\
          \ requirements]\n    require(len(set(ids)) == len(ids), '同一能力不可重复')\n    catalog = catalog_map(ctx, 'cap')\n   \
          \ proposed = {item['id']: item for item in ctx.get('capability_bundle', {}).get('items', []) if item.get('source')\
          \ == 'generated'}\n    for index, item in enumerate(requirements):\n        source = catalog.get(item['id']) if\
          \ item['source'] == 'catalog' else proposed.get(item['id'])\n        require(source is not None and item['name']\
          \ == source['name'], '草稿引用了未知能力或改写词典名称')\n        levels = levels_of(source) if item['source'] == 'catalog' else\
          \ source['levels']\n        require(item['required_level'] in levels and text(item.get('radar_name'), 80), '要求等级或雷达图名称不合法')\n\
          \        require(content['cap'][index] == [item['name'], item['required_level'], item['radar_name']], '编辑器能力数组与身份记录不一致')\n\
          \        descriptions = item.get('level_descriptions', [])\n        require([row.get('level') for row in descriptions]\
          \ == levels, '须按顺序覆盖能力全部已配置等级，不得遗漏或补造等级')\n        structure = ctx['generation_preferences']['description_structure']\n\
          \        for row in descriptions:\n            require(text(row.get('behavior'), 2000), '每个等级必须有行为描述')\n       \
          \     require(structure == 'behavior' or text(row.get('context'), 2000), '所选描述方式需要等级情境')\n            require(structure\
          \ != 'context_behavior_result' or text(row.get('outcome'), 2000), '所选描述方式需要预期成果')\n            require(structure\
          \ != 'behavior' or (not row.get('context') and not row.get('outcome')), '只写行为时不附加情境或成果字段')\n            require(structure\
          \ != 'context_behavior' or not row.get('outcome'), '带上情境时不附加成果字段')\n        if item['source'] == 'generated':\n\
          \            require(text(item.get('definition'), 1000) and item.get('dimension') in ctx['catalog'].get('ability_dimensions',\
          \ []), '新能力须包含定义和合法维度')\n    for duty in content['duty']:\n        require(isinstance(duty, dict) and text(duty.get('n'),\
          \ 200) and isinstance(duty.get('t'), list)\n                and all(text(task, 500) for task in duty['t']), '职责任务内容不合法')\n\
          \    require(all(text(value, 500) for value in content['exp']), '经历经验含空白或超长条目')\n    for kind in ['pow', 'pot']:\n\
          \        names = [item['name'] for item in ctx['catalog'].get(kind, [])]\n        require(all(names.count(value)\
          \ == 1 for value in content[kind]), '动力或潜力须唯一引用已有固定词典')\n    return draft\n\ndef normalize(action, payload_json):\n\
          \    ctx = {'action': action}\n    try:\n        require(isinstance(payload_json, str) and len(payload_json) <=\
          \ 120000, 'payload_json须为不超过120000字符的JSON文本')\n        payload = json.loads(payload_json)\n        require(isinstance(payload,\
          \ dict), 'payload_json须为JSON对象')\n        dump(payload)\n        ctx.update(payload)\n        ctx['action'] = action\n\
          \        require(action in PHASES and ctx.get('phase') in PHASES[action], '当前阶段不允许执行该动作')\n        require(all(text(ctx.get(key),\
          \ 128) for key in ['request_id', 'session_id']), '缺少请求或会话标识')\n        require(type(ctx.get('draft_version', 0))\
          \ is int and ctx.get('draft_version', 0) >= 0, '草稿版本不合法')\n        enabled, selected = ctx.get('enabled_sections'),\
          \ ctx.get('selected_sections')\n        require(isinstance(enabled, list) and isinstance(selected, list) and bool(selected)\n\
          \                and all(key in SECTIONS and key in enabled for key in selected)\n                and len(set(selected))\
          \ == len(selected), '请在启用维度中至少选择一项，不能重复')\n        require(ctx.get('operation') in ['new', 'update'], '本次操作须为新建或更新')\n\
          \        catalog = ctx.get('catalog', {})\n        require(isinstance(catalog, dict) and text(catalog.get('version'),\
          \ 128), '业务服务须提供当前词典版本')\n        for kind in ['positions', 'categories', 'cap', 'pow', 'pot']:\n            items\
          \ = catalog.setdefault(kind, [])\n            require(isinstance(items, list) and len(items) <= 500 and all(isinstance(item,\
          \ dict) and text(item.get('id'),128)\n                    and text(item.get('name'),120) for item in items), '岗位、类别和指标候选结构不合法')\n\
          \            require(len({item['id'] for item in items}) == len(items), '候选ID重复')\n        for item in catalog['cap']:\n\
          \            levels_of(item)\n        ctx['catalog'] = catalog\n        brief = ctx.setdefault('brief', {})\n  \
          \      require(isinstance(brief, dict) and (not brief.get('position_id') or brief['position_id'] in catalog_map(ctx,'positions')),\
          \ '目标岗位不在当前可用岗位中')\n        if ctx['operation'] == 'update':\n            source = ctx.get('source_standard', {})\n\
          \            require(isinstance(source, dict) and text(source.get('id'),128) and text(source.get('version'),128)\n\
          \                    and isinstance(source.get('content'),dict), '更新须提供原标准及版本')\n        refs = ctx.setdefault('reference_context',\
          \ [])\n        require(isinstance(refs,list) and len(refs)<=10 and all(isinstance(item,dict) and text(item.get('id'),128)\n\
          \                and text(item.get('text'),40000) for item in refs) and sum(len(item['text']) for item in refs)<=40000,\
          \ '参考资料须为有效文本，最多10份、总计40000字符')\n        if action in ['analyze_brief','revise_draft']:\n            require(text(ctx.get('user_message'),3000),\
          \ '请填写本轮需求或修改要求')\n        if action not in ['analyze_brief','confirm_settings']:\n            require(ctx.get('settings_confirmed')\
          \ is True and ctx.get('preferences_confirmed') is True, '须先确认生成设置和生成偏好')\n            preferences = ctx.get('generation_preferences',\
          \ {})\n            require(preferences.get('detail') in DETAILS, '详略须为简洁、精要、适中、充实、详细五档之一')\n            if 'cap'\
          \ in selected:\n                require(preferences.get('description_structure') in STRUCTURES, '能力描述方式不合法')\n \
          \           else:\n                preferences.pop('description_structure', None)\n        if action == 'confirm_sort':\n\
          \            sorted_items(ctx)\n        if action == 'prepare_capabilities' and ctx.get('capability_lookup', {}).get('complete')\
          \ is True:\n            require(ctx['capability_lookup'].get('catalog_version') == catalog['version'], '平台检索与当前词典版本不一致，请重新检索')\n\
          \        if action == 'generate_draft':\n            if 'cap' in selected:\n                sorted_items(ctx, True)\n\
          \                require(ctx['phase'] == 'compare', '有能力候选时须完成排序评分后生成')\n            else:\n                require(ctx['phase']\
          \ == 'outline', '无能力维度时由偏好阶段直接生成')\n        if action in ['revise_draft','suggest_similar_positions','prepare_apply']:\n\
          \            require(ctx.get('draft_version',0)>0 and ctx.get('expected_draft_version') == ctx['draft_version'],\
          \ '草稿已变化，请重新读取最新版本')\n            content_errors(ctx, ctx.get('draft'))\n        if action == 'suggest_similar_positions':\n\
          \            require(ctx['operation'] == 'new' and brief.get('position_id'), '更新保留原范围；无目标岗位不能推断相似岗位')\n        routes\
          \ = {'analyze_brief':'analyze','prepare_capabilities':'candidates','generate_draft':'generate',\n              \
          \    'revise_draft':'revise','suggest_similar_positions':'similar'}\n        route = routes.get(action, 'control')\n\
          \        if action == 'prepare_capabilities' and ('cap' not in selected or ctx.get('capability_lookup',{}).get('complete')\
          \ is not True):\n            route = 'control'\n        return {'valid':True,'context_json':dump(ctx),'errors_json':'[]','route':route}\n\
          \    except (ValueError,TypeError,KeyError) as error:\n        return {'valid':False,'context_json':dump(ctx),'errors_json':dump([str(error)]),'route':'control'}\n\
          \ndef main(action, payload_json):\n    return normalize(action, payload_json)"
        variables:
        - variable: action
          value_selector:
          - start
          - action
          value_type: string
        - variable: payload_json
          value_selector:
          - start
          - payload_json
          value_type: string
        outputs:
          valid:
            type: boolean
            children: null
          context_json:
            type: string
            children: null
          errors_json:
            type: string
            children: null
          route:
            type: string
            children: null
    - id: input_valid
      type: custom
      position:
        x: 700
        y: 480
      positionAbsolute:
        x: 700
        y: 480
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: if-else
        title: 输入是否有效
        desc: 1127流程；业务服务控制会话、权限与最终保存。
        selected: false
        cases:
        - id: valid
          case_id: valid
          logical_operator: and
          conditions:
          - id: valid-condition
            variable_selector:
            - normalize
            - valid
            comparison_operator: is
            value: true
            varType: boolean
