              if low:
                  questions.append('以下条目依据不足，请确认：' + '、'.join(low))
              status = 'needs_confirmation' if questions else 'ok'
              return envelope(ctx, status, '草稿已生成，请查看全文并确认应用范围。' if status == 'ok' else '草稿已生成，仍有内容需要确认。',
