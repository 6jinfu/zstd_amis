    - id: generate_result
      type: custom
      position:
        x: 4090
        y: 400
      positionAbsolute:
        x: 4090
        y: 400
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: code
        title: 校验草稿并映射编辑器字段
        desc: ''
        selected: false
        code: |-
          import copy
          import json
          import math

          SECTIONS = ['duty', 'exp', 'cap', 'pow', 'pot']

          def dump(value):
              return json.dumps(value, ensure_ascii=False, allow_nan=False, separators=(',', ':'))

          def empty_content():
              return {key: [] for key in SECTIONS}

          def envelope(ctx, status, reply, **extra):
              result = {
                  'schema_version': '2.0', 'action': ctx.get('action', ''),
                  'request_id': ctx.get('request_id', ''), 'session_id': ctx.get('session_id', ''),
                  'phase': ctx.get('phase', ''), 'base_draft_version': ctx.get('draft_version', 0),
                  'source_standard_id': ctx.get('source_standard', {}).get('id', ''),
                  'source_standard_version': ctx.get('source_standard', {}).get('version', ''),
                  'status': status, 'reply': reply, 'can_apply': False,
                  'issues': [], 'questions': [], 'draft': None, 'evidence_notes': []
              }
              result.update(extra)
              return {'result_json': dump(result)}

          def string(value, limit=3000):
              return isinstance(value, str) and bool(value.strip()) and len(value) <= limit

          def strings(value, limit=3000, maximum=30):
              return isinstance(value, list) and len(value) <= maximum and all(string(v, limit) for v in value)

          def sections_valid(value):
              return isinstance(value, list) and bool(value) and all(isinstance(k, str) and k in SECTIONS for k in value) and len(value) == len(set(value))

          def content_errors(content, catalog=None, allowed=None, require_nonempty=False):
              errors = []
              if not isinstance(content, dict) or set(content) != set(SECTIONS):
                  return ['content 必须完整包含 duty/exp/cap/pow/pot 五个数组']
              for key in SECTIONS:
                  rows = content[key]
                  if not isinstance(rows, list) or len(rows) > 20:
                      errors.append(key + ' 必须为不超过20项的数组')
                      continue
                  if allowed is not None and key not in allowed and rows:
                      errors.append('模型修改了本次范围以外的维度：' + key)
                  if require_nonempty and key in (allowed or []) and not rows:
                      errors.append('所选维度缺少内容：' + key)
                  names = []
                  for row in rows:
                      if key == 'duty':
                          if not isinstance(row, dict) or set(row) != {'n', 't'} or not string(row.get('n'), 200) or not strings(row.get('t'), 500, 10) or not row.get('t'):
                              errors.append('职责必须有名称及1至10项非空任务')
                              continue
                          name = row['n']
                          if len(set(row['t'])) != len(row['t']):
                              errors.append('职责内存在重复任务')
                      elif key == 'cap':
                          if not isinstance(row, list) or len(row) != 2 or not string(row[0], 120) or row[1] not in ['L1', 'L2', 'L3', 'L4', 'L5']:
                              errors.append('能力名称或等级不合法；不自动补为L3')
                              continue
                          name = row[0]
                      else:
                          if not string(row, 500 if key == 'exp' else 120):
                              errors.append(key + ' 含空白或不合法条目')
                              continue
                          name = row
                      names.append(name)
                      if catalog is not None and key in ['cap', 'pow', 'pot']:
                          matches = [x for x in catalog.get(key, []) if x['name'] == name]
                          if len(matches) != 1:
                              errors.append('指标不在本次候选库中：' + name)
                          elif key == 'cap' and row[1] not in [x['level'] for x in matches[0]['levels']]:
                              errors.append('能力等级未在候选库定义：' + name)
                  if len(names) != len(set(names)):
                      errors.append(key + ' 存在同名重复条目')
              return errors

          def evidence_errors(notes, ctx):
              if not isinstance(notes, list) or len(notes) > 100:
                  return ['依据必须为不超过100项的数组']
              errors = []
              sources = {'user_request': ctx.get('user_message', ''), 'confirmed_brief': dump(ctx.get('brief', {}))}
              if ctx.get('source_standard'):
                  sources['source_standard'] = dump(ctx['source_standard'])
              sources.update({x['id']: x['text'] for x in ctx.get('reference_context', [])})
              for note in notes:
                  if not isinstance(note, dict):
                      errors.append('依据条目类型不合法')
                      continue
                  score = note.get('confidence')
                  ids = note.get('source_ids')
                  if note.get('section') not in SECTIONS + ['modeling'] or not string(note.get('item'), 500) or note.get('basis') not in ['user', 'reference', 'inference']:
                      errors.append('依据字段不合法')
                  if isinstance(score, bool) or not isinstance(score, (int, float)) or not math.isfinite(score) or not 0 <= score <= 1:
                      errors.append('依据置信度必须为0到1的有限数值')
                  if not isinstance(ids, list) or any(not isinstance(i, str) or i not in sources for i in ids):
                      errors.append('依据引用了不存在的来源')
                  elif note.get('basis') == 'reference':
                      quote = note.get('quote', '')
                      if not string(quote, 1000) or not any(''.join(quote.split()) in ''.join(sources[i].split()) for i in ids):
                          errors.append('资料依据必须包含可在指定来源核对的原文片段')
              return errors

          def coverage_errors(notes, content, selected):
              errors = []
              for key in selected:
                  for row in content[key]:
                      name = row['n'] if key == 'duty' else row[0] if key == 'cap' else row
                      if not any(n.get('section') == key and n.get('item') == name for n in notes):
                          errors.append('缺少条目依据：' + name)
              return errors

          def main(context_json, work, indicators):
              ctx = json.loads(context_json)
              catalog = ctx['catalog']
              selected = ctx['selected_sections']
              errors = []
              content = empty_content()
              for key in ['duty', 'exp']:
                  if key in selected:
                      content[key] = work.get(key, [])
                  elif work.get(key):
                      errors.append('工作要求节点返回了未选择的维度：' + key)
              for key in ['cap', 'pow', 'pot']:
                  rows = indicators.get(key, [])
                  if not isinstance(rows, list) or len(rows) > 20:
                      errors.append('指标输出数量或结构不合法：' + key)
                      continue
                  if key not in selected and rows:
                      errors.append('返回了未选择的指标维度：' + key)
                  for row in rows:
                      if not isinstance(row, dict):
                          errors.append('指标条目必须是对象')
                          continue
                      matches = [x for x in catalog[key] if x['id'] == row.get('id')]
                      if len(matches) != 1:
                          errors.append('模型返回了不存在的指标ID：' + str(row.get('id')))
                          continue
                      item = matches[0]
                      if key == 'cap':
                          if row.get('level') not in [x['level'] for x in item['levels']]:
                              errors.append('能力等级不在企业定义中：' + item['name'])
                              continue
                          content[key].append([item['name'], row['level']])
                      else:
                          content[key].append(item['name'])
              notes = work.get('evidence_notes', []) + indicators.get('evidence_notes', [])
              # Internal work reasoning may include duties even when duty is not selected.
              notes = [n for n in notes if isinstance(n, dict) and n.get('section') in selected]
              structural = content_errors(content, catalog, allowed=selected)
              errors.extend(structural)
              errors.extend(evidence_errors(notes, ctx))
              if not structural:
                  errors.extend(coverage_errors(notes, content, selected))
              if ctx['operation'] == 'update':
                  source = ctx['source_standard']
                  draft = {key: copy.deepcopy(source.get(key, '')) for key in ['name', 'category', 'description', 'mode', 'positions', 'groups']}
              else:
                  category_id = work.get('category_id', '')
                  category = next((x for x in catalog['categories'] if x['id'] == category_id), None)
                  if not category:
                      errors.append('标准类别不在当前类别树中')
                  if not string(work.get('name'), 80) or not string(work.get('description'), 2000):
                      errors.append('标准名称或说明不合法')
                  draft = {'name': work.get('name', ''), 'category': category['name'] if category else '', 'description': work.get('description', ''), 'mode': 'none', 'positions': [], 'groups': []}
              draft['content'] = content
              if errors:
                  return envelope(ctx, 'invalid', '草稿未通过校验，已保留原内容，请重试。', issues=list(dict.fromkeys(errors)))
              questions = work.get('questions', []) + indicators.get('questions', [])
              unmatched = indicators.get('unmatched_suggestions', [])
              missing = [key for key in selected if not content[key]]
              if missing:
                  questions.append('以下所选维度没有可采用内容，请调整候选或确认处理：' + '、'.join(missing))
