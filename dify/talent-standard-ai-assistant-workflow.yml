app:
  description: 严格对应人才标准原型：需求整理→建模确认→侧重确认→草稿生成/局部修改→页面确认范围及更新方式→编辑保存。状态由业务服务控制。
  icon: 🧭
  icon_background: '#DCE7FF'
  mode: workflow
  name: 人才发展｜人才标准 AI 帮建（分阶段）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: true
      allowed_file_extensions:
      - .PDF
      - .DOCX
      - .XLSX
      - .CSV
      - .TXT
      - .MD
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      number_limits: 10
      fileUploadConfig:
        file_size_limit: 30
        batch_count_limit: 10
        workflow_file_upload_limit: 10
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 480
      positionAbsolute:
        x: 0
        y: 480
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: start
        title: 页面动作与当前状态
        desc: 动作由业务代码传入；步骤与当前人才标准原型一致。
        selected: false
        variables:
        - variable: action
          label: 本次动作
          type: select
          required: true
          default: analyze_brief
          options:
          - analyze_brief
          - generate_draft
          - revise_draft
          max_length: 32
        - variable: payload_json
          label: 当前页面状态JSON
          type: paragraph
          required: true
          max_length: 60000
          default: '{"request_id": "demo-request-001", "session_id": "demo-session-001", "phase": "welcome", "user_message":
            "为企业软件业务的初级个人贡献者建立通用标准，先生成职责任务和经历经验。", "operation": "new", "draft_version": 0, "enabled_sections": ["duty", "exp",
            "cap", "pow", "pot"], "selected_sections": ["duty", "exp"], "brief": {}, "catalog": {"positions": [], "categories":
            [{"id": "general", "name": "通用标准"}], "cap": [], "pow": [], "pot": []}, "reference_context": []}'
        - variable: reference_files
          label: 新增参考资料（仅整理建模信息时）
          type: file-list
          required: false
          max_length: 10
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .PDF
          - .DOCX
          - .XLSX
          - .CSV
          - .TXT
          - .MD
          allowed_file_upload_methods:
          - local_file
          - remote_url
    - id: normalize
      type: custom
      position:
        x: 340
        y: 480
      positionAbsolute:
        x: 340
        y: 480
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: code
        title: 校验页面步骤与数据边界
        desc: ''
        selected: false
        code: |-
          import copy
          import json
          import math

          SECTIONS = ['duty', 'exp', 'cap', 'pow', 'pot']

          def dump(value):
              return json.dumps(value, ensure_ascii=False, allow_nan=False, separators=(',', ':'))

          def empty_content():
              return {key: [] for key in SECTIONS}

          def envelope(ctx, status, reply, **extra):
              result = {
                  'schema_version': '2.0', 'action': ctx.get('action', ''),
                  'request_id': ctx.get('request_id', ''), 'session_id': ctx.get('session_id', ''),
                  'phase': ctx.get('phase', ''), 'base_draft_version': ctx.get('draft_version', 0),
                  'source_standard_id': ctx.get('source_standard', {}).get('id', ''),
                  'source_standard_version': ctx.get('source_standard', {}).get('version', ''),
                  'status': status, 'reply': reply, 'can_apply': False,
                  'issues': [], 'questions': [], 'draft': None, 'evidence_notes': []
              }
              result.update(extra)
              return {'result_json': dump(result)}

          def string(value, limit=3000):
              return isinstance(value, str) and bool(value.strip()) and len(value) <= limit

          def strings(value, limit=3000, maximum=30):
              return isinstance(value, list) and len(value) <= maximum and all(string(v, limit) for v in value)

          def sections_valid(value):
              return isinstance(value, list) and bool(value) and all(isinstance(k, str) and k in SECTIONS for k in value) and len(value) == len(set(value))

          def content_errors(content, catalog=None, allowed=None, require_nonempty=False):
              errors = []
              if not isinstance(content, dict) or set(content) != set(SECTIONS):
                  return ['content 必须完整包含 duty/exp/cap/pow/pot 五个数组']
              for key in SECTIONS:
                  rows = content[key]
                  if not isinstance(rows, list) or len(rows) > 20:
                      errors.append(key + ' 必须为不超过20项的数组')
                      continue
                  if allowed is not None and key not in allowed and rows:
                      errors.append('模型修改了本次范围以外的维度：' + key)
                  if require_nonempty and key in (allowed or []) and not rows:
                      errors.append('所选维度缺少内容：' + key)
                  names = []
                  for row in rows:
                      if key == 'duty':
                          if not isinstance(row, dict) or set(row) != {'n', 't'} or not string(row.get('n'), 200) or not strings(row.get('t'), 500, 10) or not row.get('t'):
                              errors.append('职责必须有名称及1至10项非空任务')
                              continue
                          name = row['n']
                          if len(set(row['t'])) != len(row['t']):
                              errors.append('职责内存在重复任务')
                      elif key == 'cap':
                          if not isinstance(row, list) or len(row) != 2 or not string(row[0], 120) or row[1] not in ['L1', 'L2', 'L3', 'L4', 'L5']:
                              errors.append('能力名称或等级不合法；不自动补为L3')
                              continue
                          name = row[0]
                      else:
                          if not string(row, 500 if key == 'exp' else 120):
                              errors.append(key + ' 含空白或不合法条目')
                              continue
                          name = row
                      names.append(name)
                      if catalog is not None and key in ['cap', 'pow', 'pot']:
                          matches = [x for x in catalog.get(key, []) if x['name'] == name]
                          if len(matches) != 1:
                              errors.append('指标不在本次候选库中：' + name)
                          elif key == 'cap' and row[1] not in [x['level'] for x in matches[0]['levels']]:
                              errors.append('能力等级未在候选库定义：' + name)
                  if len(names) != len(set(names)):
                      errors.append(key + ' 存在同名重复条目')
              return errors

          def evidence_errors(notes, ctx):
              if not isinstance(notes, list) or len(notes) > 100:
                  return ['依据必须为不超过100项的数组']
              errors = []
              sources = {'user_request': ctx.get('user_message', ''), 'confirmed_brief': dump(ctx.get('brief', {}))}
              if ctx.get('source_standard'):
                  sources['source_standard'] = dump(ctx['source_standard'])
              sources.update({x['id']: x['text'] for x in ctx.get('reference_context', [])})
              for note in notes:
                  if not isinstance(note, dict):
                      errors.append('依据条目类型不合法')
                      continue
                  score = note.get('confidence')
                  ids = note.get('source_ids')
                  if note.get('section') not in SECTIONS + ['modeling'] or not string(note.get('item'), 500) or note.get('basis') not in ['user', 'reference', 'inference']:
                      errors.append('依据字段不合法')
                  if isinstance(score, bool) or not isinstance(score, (int, float)) or not math.isfinite(score) or not 0 <= score <= 1:
                      errors.append('依据置信度必须为0到1的有限数值')
                  if not isinstance(ids, list) or any(not isinstance(i, str) or i not in sources for i in ids):
                      errors.append('依据引用了不存在的来源')
                  elif note.get('basis') == 'reference':
                      quote = note.get('quote', '')
                      if not string(quote, 1000) or not any(''.join(quote.split()) in ''.join(sources[i].split()) for i in ids):
                          errors.append('资料依据必须包含可在指定来源核对的原文片段')
              return errors

          def coverage_errors(notes, content, selected):
              errors = []
              for key in selected:
                  for row in content[key]:
                      name = row['n'] if key == 'duty' else row[0] if key == 'cap' else row
                      if not any(n.get('section') == key and n.get('item') == name for n in notes):
                          errors.append('缺少条目依据：' + name)
              return errors

          def main(action, payload_json):
              ctx = {'action': action}
              errors = []
              try:
                  if not isinstance(payload_json, str) or len(payload_json) > 60000:
                      raise ValueError('payload length')
                  payload = json.loads(payload_json)
                  dump(payload)
              except (ValueError, TypeError):
                  payload = None
              if not isinstance(payload, dict):
                  errors.append('payload_json 必须是不超过60000字且不含非有限数值的JSON对象')
                  payload = {}
              ctx.update(payload)
              ctx['action'] = action
              for field in ['request_id', 'session_id']:
                  if not string(ctx.get(field), 128):
                      errors.append(field + ' 不能为空且不能超过128字')
              if action not in ['analyze_brief', 'generate_draft', 'revise_draft']:
                  errors.append('不支持的action')
              phase = ctx.get('phase')
              allowed_phases = {'analyze_brief': ['welcome', 'review'], 'generate_draft': ['outline'], 'revise_draft': ['scope']}
              if phase not in allowed_phases.get(action, []):
                  errors.append('当前页面阶段不允许执行该动作')
              if not isinstance(ctx.get('user_message', ''), str) or len(ctx.get('user_message', '')) > 3000:
                  errors.append('user_message 必须是不超过3000字的文本')
              if action in ['analyze_brief', 'revise_draft'] and not string(ctx.get('user_message'), 3000):
                  errors.append('请输入具体建模需求或调整要求')
              version = ctx.get('draft_version', 0)
              if isinstance(version, bool) or not isinstance(version, int) or version < 0:
                  errors.append('draft_version 必须为非负整数')
              ctx['draft_version'] = version
              brief = ctx.get('brief', {})
              if not isinstance(brief, dict):
                  errors.append('brief 必须是对象')
                  brief = {}
              ctx['brief'] = brief
              enabled = ctx.get('enabled_sections')
              selected = ctx.get('selected_sections')
              for name, value in [('enabled_sections', enabled), ('selected_sections', selected)]:
                  if not sections_valid(value):
                      errors.append(name + ' 必须是五类维度中的非空无重复数组')
              if isinstance(enabled, list) and isinstance(selected, list) and any(k not in enabled for k in selected):
                  errors.append('本次生成内容包含企业未启用的维度')
              catalog = ctx.get('catalog', {})
              if not isinstance(catalog, dict):
                  errors.append('catalog 必须是对象')
                  catalog = {}
              ctx['catalog'] = catalog
              for key in ['positions', 'categories', 'cap', 'pow', 'pot']:
                  rows = catalog.get(key, [])
                  if not isinstance(rows, list) or len(rows) > 200:
                      errors.append('候选库 ' + key + ' 必须是不超过200项的数组')
                      rows = []
                  seen_ids, seen_names = set(), set()
                  for row in rows:
                      if not isinstance(row, dict) or not string(row.get('id'), 128) or not string(row.get('name'), 120):
                          errors.append('候选库 ' + key + ' 缺少合法id/name')
                          continue
                      if row['id'] in seen_ids or row['name'] in seen_names:
                          errors.append('候选库 ' + key + ' 含重复id或名称')
                      seen_ids.add(row['id'])
                      seen_names.add(row['name'])
                      if key == 'cap':
                          levels = row.get('levels', [])
                          if not isinstance(levels, list) or not levels or len(levels) > 5:
                              errors.append('能力候选缺少等级定义')
                              continue
                          codes = []
                          for level in levels:
                              if not isinstance(level, dict) or level.get('level') not in ['L1', 'L2', 'L3', 'L4', 'L5'] or not string(level.get('description'), 1000):
                                  errors.append('能力候选的等级定义不合法')
                              else:
                                  codes.append(level['level'])
                          if len(codes) != len(set(codes)):
                              errors.append('能力候选存在重复等级定义')
                  catalog[key] = rows
              position_id = brief.get('position_id', '')
              if position_id and position_id not in [x.get('id') for x in catalog['positions'] if isinstance(x, dict)]:
                  errors.append('目标岗位ID不在本次候选岗位中')
              source = ctx.get('source_standard', {})
              if not isinstance(source, dict):
                  errors.append('source_standard 必须是对象')
                  source = {}
              ctx['source_standard'] = source
              operation = ctx.get('operation', 'new')
              if operation not in ['new', 'update']:
                  errors.append('operation 只能为new或update')
              if operation == 'update':
                  if not string(source.get('id'), 128) or not string(source.get('version'), 128):
                      errors.append('更新已有标准必须传入原标准ID和版本字符串')
                  for field in ['name', 'category']:
                      if not string(source.get(field), 120):
                          errors.append('原标准缺少' + field)
                  if not isinstance(source.get('description', ''), str) or source.get('mode') not in ['positions', 'rules', 'none'] or not isinstance(source.get('positions'), list) or not isinstance(source.get('groups'), list):
                      errors.append('原标准的基本信息或应用范围不完整')
                  errors.extend(content_errors(source.get('content')))
              elif source:
                  errors.append('新建操作不能夹带source_standard')
              ctx['operation'] = operation
              references = ctx.get('reference_context', [])
              if not isinstance(references, list) or len(references) > 10:
                  errors.append('reference_context 必须是不超过10份资料的数组')
                  references = []
              ids, total = set(), 0
              for ref in references:
                  if not isinstance(ref, dict) or not string(ref.get('id'), 128) or not string(ref.get('name'), 200) or not string(ref.get('text'), 40000):
                      errors.append('资料必须包含合法id/name/text')
                      continue
                  if ref['id'] in ids or ref['id'] in ['user_request', 'confirmed_brief', 'source_standard']:
                      errors.append('资料ID重复或占用保留来源名')
                  ids.add(ref['id'])
                  total += len(ref['text'])
              if total > 40000:
                  errors.append('参考文本合计不能超过40000字；请由业务服务先分段筛选')
              ctx['reference_context'] = references
              if action in ['generate_draft', 'revise_draft']:
                  if ctx.get('brief_confirmed') is not True or ctx.get('focus_confirmed') is not True:
                      errors.append('必须先确认建模信息，再确认内容侧重')
                  if not string(brief.get('scenario'), 3000) or brief.get('level') not in ['未指定', '基层/初级', '中层/中级', '高层/高级'] or brief.get('management') not in ['未指定', '不带团队', '带团队']:
                      errors.append('已确认建模信息不完整或使用了页面以外的选项')
                  if ctx.get('detail') not in ['concise', 'regular'] or ctx.get('focus') not in ['balanced', 'delivery', 'collaboration', 'leadership']:
                      errors.append('缺少合法的内容详略和优先呈现选项')
                  if operation == 'new' and not catalog['categories']:
                      errors.append('新建标准需要当前可用标准类别')
                  for key in ['cap', 'pow', 'pot']:
                      if isinstance(selected, list) and key in selected and not catalog[key]:
                          errors.append('所选维度缺少企业指标候选：' + key)
              if action == 'revise_draft':
                  expected = ctx.get('expected_draft_version')
                  if isinstance(expected, bool) or not isinstance(expected, int) or expected != version or not version:
                      errors.append('修改必须携带匹配且大于0的expected_draft_version')
                  draft = ctx.get('draft')
                  if not isinstance(draft, dict):
                      errors.append('修改缺少当前完整草稿')
                  else:
                      errors.extend(content_errors(draft.get('content')))
                      for field in ['name', 'category', 'description', 'mode', 'positions', 'groups']:
                          if field not in draft:
                              errors.append('当前草稿缺少' + field)
              prior_notes = ctx.get('draft_evidence_notes', [])
              if not isinstance(prior_notes, list):
                  errors.append('draft_evidence_notes 必须是数组')
              ctx['needs_indicators'] = any(k in (selected or []) for k in ['cap', 'pow', 'pot']) if isinstance(selected, list) else False
              return {'context_json': dump(ctx), 'valid': not errors, 'action': action, 'needs_indicators': ctx['needs_indicators'], 'errors_json': dump(errors)}
        code_language: python3
        variables:
        - variable: action
          value_selector:
          - start
          - action
        - variable: payload_json
          value_selector:
          - start
          - payload_json
        outputs:
          context_json:
            type: string
            children: null
          valid:
            type: boolean
            children: null
          action:
            type: string
            children: null
          needs_indicators:
            type: boolean
            children: null
          errors_json:
            type: string
            children: null
    - id: input_valid
      type: custom
      position:
        x: 680
        y: 480
      positionAbsolute:
        x: 680
        y: 480
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: if-else
        title: 输入与确认是否有效
        desc: ''
        selected: false
        cases:
        - case_id: valid
          id: valid
          logical_operator: and
          conditions:
          - id: valid-condition
            variable_selector:
            - normalize
            - valid
            varType: boolean
            comparison_operator: is
            value: true
    - id: input_error
      type: custom
      position:
        x: 1030
        y: 1100
      positionAbsolute:
        x: 1030
        y: 1100
      width: 280
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: code
        title: 返回输入问题
        desc: ''
        selected: false
        code: |-
