                  return ['依据必须为不超过100项的数组']
              errors = []
              sources = {'user_request': ctx.get('user_message', ''), 'confirmed_brief': dump(ctx.get('brief', {}))}
              if ctx.get('source_standard'):
                  sources['source_standard'] = dump(ctx['source_standard'])
              sources.update({x['id']: x['text'] for x in ctx.get('reference_context', [])})
              for note in notes:
                  if not isinstance(note, dict):
                      errors.append('依据条目类型不合法')
                      continue
                  score = note.get('confidence')
                  ids = note.get('source_ids')
                  if note.get('section') not in SECTIONS + ['modeling'] or not string(note.get('item'), 500) or note.get('basis') not in ['user', 'reference', 'inference']:
                      errors.append('依据字段不合法')
                  if isinstance(score, bool) or not isinstance(score, (int, float)) or not math.isfinite(score) or not 0 <= score <= 1:
                      errors.append('依据置信度必须为0到1的有限数值')
                  if not isinstance(ids, list) or any(not isinstance(i, str) or i not in sources for i in ids):
                      errors.append('依据引用了不存在的来源')
                  elif note.get('basis') == 'reference':
                      quote = note.get('quote', '')
                      if not string(quote, 1000) or not any(''.join(quote.split()) in ''.join(sources[i].split()) for i in ids):
                          errors.append('资料依据必须包含可在指定来源核对的原文片段')
              return errors

          def coverage_errors(notes, content, selected):
              errors = []
              for key in selected:
                  for row in content[key]:
                      name = row['n'] if key == 'duty' else row[0] if key == 'cap' else row
                      if not any(n.get('section') == key and n.get('item') == name for n in notes):
                          errors.append('缺少条目依据：' + name)
              return errors

          def main(context_json, plan_json, model):
              ctx = json.loads(context_json)
              targets = json.loads(plan_json)['target_sections']
              content = model.get('content')
              notes = model.get('evidence_notes', [])
              structural = content_errors(content, ctx['catalog'], allowed=targets)
              errors = list(structural)
              errors.extend(evidence_errors(notes, ctx))
              if not structural:
                  errors.extend(coverage_errors(notes, content, targets))
              if any(n.get('section') not in targets for n in notes if isinstance(n, dict)):
                  errors.append('修改依据超出本次目标维度')
              questions = model.get('questions', [])
              if not strings(questions):
                  errors.append('澄清问题必须为文本数组')
              if errors:
                  return envelope(ctx, 'invalid', '修改未通过校验，原草稿保持不变。', issues=list(dict.fromkeys(errors)))
              if questions:
                  return envelope(ctx, 'needs_clarification', '本次修改仍需澄清，原草稿保持不变。', questions=questions)
              draft = copy.deepcopy(ctx['draft'])
              changes = []
              for key in targets:
                  before, after = draft['content'][key], content[key]
                  if before != after:
                      old_names = [x['n'] if key == 'duty' else x[0] if key == 'cap' else x for x in before]
                      new_names = [x['n'] if key == 'duty' else x[0] if key == 'cap' else x for x in after]
                      modified = sum(1 for item in after if (item['n'] if key == 'duty' else item[0] if key == 'cap' else item) in old_names and item != before[old_names.index(item['n'] if key == 'duty' else item[0] if key == 'cap' else item)])
                      changes.append({'section': key, 'before': len(before), 'after': len(after), 'added': len(set(new_names) - set(old_names)), 'removed': len(set(old_names) - set(new_names)), 'modified': modified})
                      draft['content'][key] = copy.deepcopy(after)
              if not changes:
                  return envelope(ctx, 'needs_clarification', '本次要求没有产生实际内容变化，请补充具体调整方向。', questions=['希望修改哪一项、改成什么内容？'])
              low = [n['item'] for n in notes if n['confidence'] < 0.65]
              questions = ['以下修改依据不足，请确认：' + '、'.join(low)] if low else []
              previous_notes = [n for n in ctx.get('draft_evidence_notes', []) if isinstance(n, dict) and n.get('section') not in targets]
              return envelope(ctx, 'needs_confirmation' if questions else 'ok', '已更新指定内容，请查看修改结果。',
                  draft=draft, can_apply=not questions, selected_sections=ctx['selected_sections'],
                  questions=questions, evidence_notes=previous_notes + notes, change_summary=changes,
                  proposed_draft_version=ctx['draft_version'] + 1, next_ui='scope')
