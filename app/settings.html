<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统设置 · 人才发展</title>
<link rel="stylesheet" href="styles.css?v=sha256-e95d77aa90e6">
<link rel="stylesheet" href="ui/components.css?v=sha256-ef5c84348116">
<link rel="stylesheet" href="settings-editor.css?v=sha256-870f46c866b6">
<link rel="stylesheet" href="production-ui.css?v=sha256-a812927bf0a8">
</head>
<body data-module="settings" data-page="settings">
<div class="app shell-v2">
<script src="navigation.js?v=sha256-fe6f0e0f3c7f"></script>
  <div class="body">
    <main class="content settings-scope-page">
      <div class="detail-main">
        <section class="d-section active" data-section="level">
          <div class="settings-editor-toolbar"><label class="settings-editor-search"><input class="input" id="level-search" type="search" aria-label="搜索序列或职级" placeholder="搜索序列、职级名称或编码"></label><button class="btn btn-primary" id="add-sequence" type="button">新增序列</button></div>
          <div class="level-tree" id="level-tree" aria-label="序列与职级"></div>
        </section>
        <section class="d-section" data-section="dimensions">
          <div class="dimension-settings-panel"><p>选择客户使用的岗位标准维度。新建标准和 AI 帮建使用已启用的维度；已有标准内容保留，更新方式在帮建结束时确认。</p><div id="dimension-settings" aria-label="岗位标准维度"></div><p id="dimension-error" role="alert"></p><div class="dimension-settings-footer"><button class="btn btn-primary" id="save-dimensions" type="button">保存</button><span id="dimension-save-state" role="status"></span></div></div>
        </section>

        <section class="d-section" data-section="learner">
          <div class="section-toolbar compact"><span class="setting-save-state" id="learner-save-state">修改后自动保存</span></div>
          <div class="learner-feature-grid" aria-label="学员端功能">
            <label class="learner-feature-option"><input type="checkbox" checked><span>人才画像</span></label>
            <label class="learner-feature-option"><input type="checkbox" checked><span>岗位发展通道</span></label>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="ui/components.js?v=sha256-8322b836883d"></script>
<script src="app.js?v=sha256-8a401953524f"></script>
<script src="talent-settings-data.js?v=sha256-9ac74d26e90d"></script>
<script src="settings-editor.js?v=sha256-0d782fabba34"></script>
<script>
(function () {
  var state = document.getElementById('learner-save-state');
  document.querySelectorAll('.learner-feature-option input').forEach(function (input) {
    input.addEventListener('change', function () {
      state.textContent = '已保存';
      state.classList.add('is-saved');
      showToast(input.parentElement.textContent.trim() + (input.checked ? '已显示' : '已隐藏'));
      window.setTimeout(function () { state.textContent = '修改后自动保存'; state.classList.remove('is-saved'); }, 1600);
    });
  });
})();
</script>
</body>
</html>
