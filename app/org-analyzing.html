<script>
  (function () {
    var stages = document.querySelectorAll('.pstage');
    var bar = document.querySelector('.progressbar > i');
    if (!stages.length) return;
    stages.forEach(function (s) { s.classList.remove('done', 'active'); s.classList.add('pending'); });
    if (bar) { bar.style.width = '0%'; bar.style.transition = 'width .6s ease'; }
    var seq = [{ i: 0, cls: 'done', w: '18' }, { i: 1, cls: 'done', w: '42' }, { i: 2, cls: 'active', w: '62' }];
    seq.forEach(function (s, k) {
      setTimeout(function () {
        stages[s.i].classList.remove('pending'); stages[s.i].classList.add(s.cls);
        if (bar) bar.style.width = s.w + '%';
      }, 450 + k * 820);
    });
  })();
</script>
