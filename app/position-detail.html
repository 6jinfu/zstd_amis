<script>
  // 同一详情骨架按案例切换业务数据；销售岗位通过 ?case=sales 进入。
  (function () {
    var algorithm = window.STANDARD_POSITION_SEEDS.algorithm;
    var sales = window.STANDARD_POSITION_SEEDS.sales;
    var demo = new URLSearchParams(location.search).get('case') === 'sales' ? sales : algorithm;
    var position = window.Standards.positions.find(function(p) { return p.id === new URLSearchParams(location.search).get('position'); });
    if (position && position.id !== demo.code) {
      demo = JSON.parse(JSON.stringify(position.id === 'SA-201' ? sales : algorithm));
      if (position.id !== 'SA-201' && position.id !== 'RD-301') {
        demo.plan = []; demo.standard = window.Standards.emptyContent();
        demo.courseOptions = []; demo.projectOptions = []; demo.examOptions = [];
      }
      demo.name = position.name; demo.code = position.id; demo.category = position.category;
      demo.level = position.category; demo.context = position.name;
    }
    window.POSITION_DEMO = demo;
    document.title = '岗位详情 · ' + demo.name;
    document.querySelector('.detail-bar h1').textContent = demo.name;
    document.querySelector('.detail-bar .text-sm').textContent = demo.code + ' · ' + demo.level;
    var fields = document.querySelectorAll('[data-section="info"] input.input');
    if (fields.length >= 3) { fields[0].value = demo.code; fields[1].value = demo.name; fields[2].value = demo.category; }
    var tbody = document.querySelector('#plan-table tbody');
    if (tbody) tbody.innerHTML = demo.plan.map(function (r) { return '<tr><td><span class="tag ' + r[1] + '">' + r[0] + '</span></td><td>' + r[2] + '</td><td class="muted">' + r[3] + '</td><td class="ops" style="justify-content:flex-end"><button class="btn-text btn-sm danger" data-del-row>移除</button></td></tr>'; }).join('');
  })();
</script>
