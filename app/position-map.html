<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岗位地图 · 发展中心</title>
<link rel="stylesheet" href="styles.css?v=sha256-e95d77aa90e6">
<link rel="stylesheet" href="ui/components.css?v=sha256-ef5c84348116">
<link rel="stylesheet" href="position-map.css?v=sha256-1b9e97e74141">
<link rel="stylesheet" href="production-ui.css?v=sha256-a812927bf0a8">
</head>
<body data-module="develop" data-page="position-map">
<div class="app shell-v2">
<script src="navigation.js?v=sha256-fe6f0e0f3c7f"></script>
  <div class="body">
    <main class="content pm-workspace">
      <div class="pm-layout">
        <aside class="pm-series-panel" aria-label="职级序列">
          <div class="pm-series-title">职级序列</div>
          <label class="pm-series-search-wrap"><span class="sr-only">搜索职级序列</span><input id="pm-series-search" type="search" placeholder="输入关键字搜索" autocomplete="off"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></label>
          <div id="pm-series-list" class="pm-series-list" aria-label="序列列表"></div>
          <a class="pm-series-settings" href="settings.html#sequence">职级框架设置</a>
        </aside>
        <section class="pm-map-panel" aria-label="岗位地图">
          <div class="pm-toolbar">
            <button class="btn btn-primary pm-add-map" type="button" id="pm-add-map">新增岗位地图</button>
            <form class="pm-position-search" id="pm-search-form" role="search"><label class="sr-only" for="pm-position-search">搜索岗位名称</label><input id="pm-position-search" type="search" placeholder="请输入岗位名称" autocomplete="off"><button class="btn btn-primary" type="submit">搜索</button></form>
          </div>
          <div class="pm-map-scroll"><div id="pm-matrix" class="pm-matrix" aria-live="polite"></div></div>
        </section>
      </div>
    </main>
  </div>
</div>

<!-- 已配节点操作菜单 -->
<div class="drawer" id="drawer-node">
  <div class="m-head"><div><h3>架构师</h3><div class="text-sm muted">技术序列 P · P4 专家</div></div><button class="icon-close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="m-body" style="padding:8px 0 0">
    <div class="action-list">
      <button class="action-item" data-open="drawer-channel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 17l4-8 4 8M5 21h14"/></svg>
        <span>查看岗位发展通道</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <a class="action-item" href="learning-plan.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>配置学习方案</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <button class="action-item" data-open="drawer-selpos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>添加岗位</span>
      </button>
      <div class="action-divider"></div>
      <button class="action-item danger" id="pm-remove-position">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        <span>移除岗位</span>
      </button>
    </div>
  </div>
  <div class="m-foot"><button class="btn btn-secondary" data-close>关闭</button></div>
</div>

<!-- 选择岗位 -->
<div class="drawer" id="drawer-selpos">
  <div class="m-head"><h3>选择岗位</h3><button class="icon-close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="m-body">
    <input class="input mb-md" id="pm-pick-search" placeholder="搜索岗位">
    <div class="table-wrap"><table class="t">
      <thead><tr><th style="width:40px"></th><th>岗位</th><th>类别</th></tr></thead>
      <tbody id="pm-pick-results"></tbody>
    </table></div>
  </div>
  <div class="m-foot"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="pm-attach-position">挂载</button></div>
</div>

<!-- 发展通道 -->
<div class="drawer" id="drawer-channel">
  <div class="m-head"><div><h3>岗位发展通道</h3><div class="text-sm muted">技术序列 P · 架构师</div></div><button class="icon-close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="m-body">
    <div style="display:flex;flex-direction:column;gap:0;align-items:flex-start">
      <div class="flex gap-sm center" style="padding:10px 0"><span class="tag tag-primary">P5</span><b>首席架构师</b><span class="tag tag-draft">未配方案</span></div>
      <div style="margin-left:10px;border-left:2px solid var(--primary-200);height:24px"></div>
      <div class="flex gap-sm center" style="padding:10px 0"><span class="tag tag-primary">P4</span><b>架构师（当前）</b><span class="tag tag-success">已配方案</span></div>
      <div style="margin-left:10px;border-left:2px solid var(--primary-200);height:24px"></div>
      <div class="flex gap-sm center" style="padding:10px 0"><span class="tag">P3</span><span class="muted">高级开发工程师</span></div>
    </div>
  </div>
  <div class="m-foot"><button class="btn btn-secondary" data-close>关闭</button></div>
</div>

<!-- 职级管理 -->
<div class="drawer" id="drawer-level">
  <div class="m-head"><div><h3>职级管理 · 技术序列 P</h3></div><button class="icon-close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="m-body">
    <div class="flex center mb-md" style="justify-content:flex-end"><button class="btn btn-primary btn-sm">+ 新增职级</button></div>
    <div class="table-wrap"><table class="t">
      <thead><tr><th>职级</th><th>名称</th><th>等级序</th><th style="text-align:right">操作</th></tr></thead>
      <tbody>
        <tr><td><b>P5</b></td><td>首席</td><td>5</td><td class="ops" style="justify-content:flex-end"><button class="btn-text btn-sm">编辑</button><button class="btn-text btn-sm danger">删除</button></td></tr>
        <tr><td><b>P4</b></td><td>专家</td><td>4</td><td class="ops" style="justify-content:flex-end"><button class="btn-text btn-sm">编辑</button></td></tr>
        <tr><td><b>P3</b></td><td>高级</td><td>3</td><td class="ops" style="justify-content:flex-end"><button class="btn-text btn-sm">编辑</button></td></tr>
        <tr><td><b>P2</b></td><td>中级</td><td>2</td><td class="ops" style="justify-content:flex-end"><button class="btn-text btn-sm">编辑</button></td></tr>
        <tr><td><b>P1</b></td><td>初级</td><td>1</td><td class="ops" style="justify-content:flex-end"><button class="btn-text btn-sm">编辑</button></td></tr>
      </tbody>
    </table></div>
  </div>
  <div class="m-foot"><button class="btn btn-secondary" data-close>关闭</button></div>
</div>

<script src="ui/components.js?v=sha256-8322b836883d"></script>
<script src="app.js?v=sha256-6796ad5142be"></script>
<script src="standard-seeds.js?v=sha256-074d6e888ad6"></script>
<script src="standards-data.js?v=sha256-5458067a498f"></script>
<script src="position-map.js?v=sha256-7d995075c60b"></script>
</body>
</html>
