<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宫格盘点 · 方案比较</title>
<style>
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
  #stage{width:100%;height:100dvh}
  #stage iframe{display:block;width:100%;height:100%;border:0}
  .proto-picker {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 8px 24px rgba(0, 0, 0, 0.24),
      0 2px 6px rgba(0, 0, 0, 0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  .proto-picker-highlight {
    position: absolute;
    top: 4px;
    left: 0;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition:
      transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
      width 250ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.4);
    outline-offset: 2px;
  }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker[data-position="top"] {
    bottom: auto;
    top: 24px;
  }
</style>
</head>
<body>
<main id="stage" aria-label="宫格盘点方案预览"></main>
<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">均衡分析</button>
  <button class="proto-picker-item">矩阵画布</button>
  <button class="proto-picker-item">分布总览</button>
</nav>
<script>
  var variants=[
    {name:'均衡分析',proto:'balanced'},
    {name:'矩阵画布',proto:'canvas'},
    {name:'分布总览',proto:'overview'}
  ];
  var stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=Array.from(picker.querySelectorAll('.proto-picker-item')),current=0;
  function moveHighlight(){var item=items[current];highlight.style.width=item.offsetWidth+'px';highlight.style.transform='translateX('+item.offsetLeft+'px)'}
  function handleKeys(event){
    var target=event.target;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)||target.isContentEditable)return;
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    if(target.closest&&target.closest('.rd-matrix')&&/^Arrow(Left|Right|Up|Down)$/.test(event.key))return;
    var number=parseInt(event.key,10);
    if(number>=1&&number<=variants.length)setActive(number-1);
    else if(event.key==='ArrowRight')setActive((current+1)%variants.length);
    else if(event.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);
  }
  function mount(index){
    var frame=document.createElement('iframe');frame.title=variants[index].name+'：销售铁军盘点结果';frame.src='frame.html?case=sales&grid=3x3&proto='+variants[index].proto+'#result';
    frame.addEventListener('load',function(){try{frame.contentWindow.addEventListener('keydown',handleKeys)}catch(error){}});
    stage.replaceChildren(frame);
  }
  function setActive(index){
    if(index<0||index>=variants.length)return;
    current=index;
    items.forEach(function(item,j){item.toggleAttribute('data-active',j===index);if(j===index)item.setAttribute('aria-current','true');else item.removeAttribute('aria-current')});
    moveHighlight();var url=new URL(location);url.searchParams.set('v',index+1);history.replaceState(null,'',url);mount(index);
  }
  items.forEach(function(item,index){item.addEventListener('click',function(){setActive(index)})});
  window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',handleKeys);
  setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
  requestAnimationFrame(function(){requestAnimationFrame(function(){picker.setAttribute('data-ready','')})});
</script>
</body>
</html>
