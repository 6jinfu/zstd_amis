<script>
  // 列表查询 / 搜索 / 重置：姓名 + 人才分类
  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.querySelector('.filter-bar'); if (!bar) return;
    var tbl = document.querySelector('.content table.t'); if (!tbl) return;
    var inp = bar.querySelector('input'), sel = bar.querySelector('select');
    var btns = bar.querySelectorAll('.actions button');
    function run() {
      var q = (inp.value || '').trim().toLowerCase(), c = sel ? sel.value : '全部', any = false;
      tbl.querySelectorAll('tbody tr').forEach(function (r) {
        if (r.classList.contains('row-empty')) return;
        var name = r.children[1].textContent.trim().toLowerCase();
        var catTag = r.querySelector('.tag:not(.tag-warning)');
        var cat = catTag ? catTag.textContent.trim() : '';
        var okQ = !q || name.indexOf(q) >= 0;
        var okC = !c || c === '全部' || cat === c;
        var show = okQ && okC; if (show) any = true;
        r.style.display = show ? '' : 'none';
      });
      var e = tbl.querySelector('tr.row-empty'); if (e) e.style.display = any ? 'none' : '';
    }
    if (btns[0]) btns[0].addEventListener('click', run);
    if (btns[1]) btns[1].addEventListener('click', function () { inp.value = ''; if (sel) sel.value = '全部'; run(); });
    run();
  });
</script>
