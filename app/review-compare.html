<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历次对比 · 评鉴中心</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-module="assess" data-page="review-compare">
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-11 4 7 7-4"/></svg></span><span class="name">人才发展</span></div>
    <nav class="nav-main"><a data-module="standard" href="org-structure.html">岗位中心</a><a data-module="assess" href="assess-projects.html">评鉴中心</a><a data-module="develop" href="position-map.html">发展中心</a><a data-module="talent" href="talent-list.html">人才中心</a><a data-module="settings" href="settings.html">系统设置</a></nav>
    <div class="right"><button class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16l-2-2z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button><div class="user"><span class="avatar">李</span><span class="uname">李文静</span></div></div>
  </header>
  <div class="body">
    <aside class="sidenav">
      <div class="group-label">测评</div>
      <a class="nav-item" data-page="assess-projects" href="assess-projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>测评项目</a>
      <a class="nav-item" data-page="assess-tools" href="assess-tools.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>测评工具库</a>
      
      <div class="group-label">盘点</div>
      <a class="nav-item" data-page="review-projects" href="review-projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>盘点项目</a>
      <a class="nav-item active" data-page="review-compare" href="review-compare.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 8l4-4 4 4M21 16l-4 4-4-4"/></svg>历次对比</a>
    </aside>

    <main class="content">
      <div class="breadcrumb">评鉴中心<span class="sep">/</span>盘点<span class="sep">/</span><span class="cur">历次对比</span></div>

      <div class="card card-pad">
        <div class="flex gap-md" style="gap:var(--space-md)">
          <div class="field" style="flex:1;margin:0"><label>对比项目 A</label><select class="select"><option>2026 年度人才盘点</option><option>2025 年度人才盘点</option></select></div>
          <div class="field" style="flex:1;margin:0"><label>对比项目 B</label><select class="select"><option>2025 年度人才盘点</option><option>2026 年度人才盘点</option></select></div>
          <div class="field" style="flex:0 0 auto;margin:0;align-self:flex-end"><button class="btn btn-primary">对比</button></div>
        </div>
      </div>

      <div class="kpi-row mt-md">
        <div class="kpi"><div class="label">高潜人数</div><div class="value">4 <span style="font-size:13px;color:var(--success)">↑ 1</span></div><div class="delta">较 2025 年</div></div>
        <div class="kpi"><div class="label">核心人数</div><div class="value">6 <span style="font-size:13px;color:var(--success)">↑ 2</span></div><div class="delta">较 2025 年</div></div>
        <div class="kpi"><div class="label">待发展人数</div><div class="value">2 <span style="font-size:13px;color:var(--danger)">↓ 1</span></div><div class="delta">较 2025 年</div></div>
        <div class="kpi"><div class="label">关键岗位储备率</div><div class="value">68%</div><div class="delta">较 2025 ↑ 5%</div></div>
      </div>

      <div class="card mt-md">
        <div class="card-head"><h2>分类分布对比</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>分层</th><th>2025 年度</th><th>2026 年度</th><th>变化</th></tr></thead>
          <tbody>
            <tr><td><span class="tag tag-primary">高潜</span></td><td>3</td><td>4</td><td><span style="color:var(--success)">+1</span></td></tr>
            <tr><td><span class="tag tag-success">核心</span></td><td>4</td><td>6</td><td><span style="color:var(--success)">+2</span></td></tr>
            <tr><td><span class="tag">中坚 / 胜任</span></td><td>15</td><td>20</td><td><span style="color:var(--success)">+5</span></td></tr>
            <tr><td><span class="tag tag-danger">待发展</span></td><td>3</td><td>2</td><td><span style="color:var(--success)">-1</span></td></tr>
          </tbody>
        </table></div>
      </div>
    </main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
