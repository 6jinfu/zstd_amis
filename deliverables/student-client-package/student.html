function positionRadarSvg(labels,series){const cx=170,cy=98,r=67,n=labels.length;const point=(value,i,rr=r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return `${(cx+Math.cos(a)*rr*value/5).toFixed(1)},${(cy+Math.sin(a)*rr*value/5).toFixed(1)}`};const grids=[1,2,3,4,5].map(level=>`<polygon points="${labels.map((_,i)=>point(level,i)).join(" ")}" fill="none" stroke="#e8ebef" stroke-width="1"/>`).join("");const axes=labels.map((_,i)=>{const [x,y]=point(5,i).split(",");return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e8ebef" stroke-width="1"/>`}).join("");const text=labels.map((label,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*(r+17),y=cy+Math.sin(a)*(r+17),anchor=Math.abs(x-cx)<8?"middle":x<cx?"end":"start";return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" fill="#626b78" font-size="10">${label}</text>`}).join("");const lines=series.map(s=>`<polygon points="${s.values.map((v,i)=>point(v,i)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2"/>${s.values.map((v,i)=>{const [x,y]=point(v,i).split(",");return `<circle cx="${x}" cy="${y}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1"/>`}).join("")}`).join("");return `<svg class="position-radar-svg" viewBox="0 0 340 205" role="img" aria-label="岗位能力雷达图"><g>${grids}${axes}${lines}${text}</g></svg><div class="position-radar-legend">${series.map(s=>`<span style="--legend:${s.color}">${s.name}</span>`).join("")}</div>`}
function positionRadarCharts(detail){const groups=detail.radars||[...new Set((detail.abilities||[]).map(x=>x.group))].map(group=>({name:group,items:(detail.abilities||[]).filter(x=>x.group===group).slice(0,6).map(x=>{const m=String(x.level||"").match(/[1-5]/);const required=m?+m[0]:3;return {name:x.name,required,pre:Math.max(1,required-1),post:required}})})).filter(x=>x.items.length);if(!groups.length)return "";return `<div class="position-radar-grid">${groups.map(group=>`<section class="position-radar-card"><h3>${group.name}</h3>${positionRadarSvg(group.items.map(x=>x.name),[{name:"岗位所需",color:"#f25247",values:group.items.map(x=>x.required)},{name:"前测",color:"#1990ff",values:group.items.map(x=>x.pre)},{name:"后测",color:"#f5ac4c",values:group.items.map(x=>x.post)}])}</section>`).join("")}</div>`}

function coursePage(){let t=CT[S.course];let body=t==="首页"?`<div class="hero"><h2>让学习发生，让成长看得见</h2><p>最新课程、智能推荐、专题速递和年度课程</p></div><div class="section-head"><h2>最新课程</h2><a>查看更多　›</a></div><div class="grid4">${courses.slice(0,4).map(courseCard).join("")}</div><div class="section-head"><h2>猜你喜欢</h2><a>查看更多　›</a></div><div class="grid4">${courses.slice(4).map(courseCard).join("")}</div>`:t==="学习地图"||t==="安排课程"||t==="专题速递"?`<div class="empty"><div><b>✦</b><span>暂无${t}数据</span></div></div>`:`<div class="panel"><h2 class="title">${t}</h2><div class="strip"><b>课程来源</b><span>全部　自选　安排　学习地图　我的培训</span><b>课程类型</b><span>全部　必修　选修　任选</span><b>学习状态</b><span>全部　未学习　进行中　已完成</span></div><div class="list">${courses.concat(courses).slice(0,9).map((x,i)=>`<article class="item"><b>${x[0]}</b><span class="tag">${i%2?"任选":"必修"}</span><span class="tag">结业条件：${i%2?"课程评估":"课后测试"}</span><p>学习进度：${i===4?"已完成":i%3===0?"50%":"0.0%"}</p><footer><span>${x[2]} · ${x[3]}</span><button class="secondary" data-action="toast">查看课程</button></footer></article>`).join("")}</div></div>`;return wrap(`<div class="crumb">资源中心　/　课程中心</div><section class="shell"><div class="tabs"><h1 style="font-size:18px;margin:0;min-width:105px">课程中心</h1>${CT.map((x,i)=>`<button data-tab="${i}" class="${S.course===i?"on":""}">${x}</button>`).join("")}<div class="grow"></div><div class="searchbox">⌕<input placeholder="输入课程关键字搜索"></div></div><div class="appbody">${body}</div></section>`)}
function material(){let recent=["新版课表—通用管理课程目录课表26.09.01","时光易培 + 人才测评： 开启‘测学一体’的人才发展新闭环","【AI陪练】产品视频","AI陪练场景化解决方案 V1.0-2025-08-29","Iris智能体搭建方法&客户案例"];return wrap(`<div class="crumb">资源中心　/　资料中心</div><section class="shell"><div class="tabs"><h1 style="font-size:18px;margin:0;min-width:105px">资料中心</h1><button data-tab="0" class="${S.material===0?"on":""}">首页</button><button data-tab="1" class="${S.material===1?"on":""}">我的资料</button><div class="grow"></div></div><div class="appbody">${S.material===0?`<div class="material-layout"><div><div class="strip"><div class="searchbox">⌕<input placeholder="资料名称"></div><b>资料分类</b><span>全部分类　文化制度　公司资料　平台　内容　运营　售前方案中心</span><b>发布时间</b><span>全部　最近一周　最近一月　最近一季度　最近一年</span><b>热门排序</b><span>最新出炉　热门推荐　浏览最多　下载最多</span></div><div class="grid3" style="margin-top:18px">${materials.map(materialCard).join("")}</div><div class="tablefoot">共2675条　<button class="on">1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>…</button><button>168</button></div></div><aside><article class="panel"><h3>最近浏览</h3>${recent.map((x,i)=>`<div class="rank"><span>${i+1}</span><b>${x}</b></div>`).join("")}<button class="primary" data-action="toast">上传我的资料</button></article><article class="panel" style="margin-top:16px"><h3>浏览排行榜</h3><div class="pills"><button class="pill active">周</button><button class="pill">季</button></div>${materials.slice(0,5).map((x,i)=>`<div class="rank"><span>0${i+1}</span><b>${x}</b></div>`).join("")}</article><article class="panel" style="margin-top:16px"><h3>点赞量排行榜</h3><div class="pills"><button class="pill active">周</button><button class="pill">月</button><button class="pill">季</button></div><div class="empty" style="min-height:120px">暂无数据</div></article></aside></div>`:`<div class="two"><article class="panel"><h3>刘金富　产品运营部</h3><div class="pills"><button class="pill active">我上传的资料</button><button class="pill">我收藏的资料</button><button class="pill">下载记录</button><button class="pill">草稿箱</button></div>${metrics()}<button class="primary" data-action="toast">上传我的资料</button></article><article class="panel"><h3>资料动态</h3>${recent.map((x,i)=>`<div class="error" style="padding:9px"><div class="num"><b>${i+1}</b></div><div class="main"><b>${x}</b><p>最近浏览</p></div></div>`).join("")}</article></div>`}</div></section>`)}
function project(){return wrap(`<div class="crumb">项目中心　/　我的项目</div><section class="shell"><div class="tabs"><h1 style="font-size:18px;margin:0;min-width:105px">混合培训</h1><button data-tab="0" class="${S.project===0?"on":""}">全部项目</button><button data-tab="1" class="${S.project===1?"on":""}">项目包</button></div><div class="appbody">${S.project===1?`<div class="empty"><div><b>▣</b><span>暂无数据</span></div></div>`:`<div class="strip"><b>项目状态</b><span>全部　进行中　未开始　已结束　已结项　可报名</span><b>项目名称</b><div class="searchbox"><input placeholder="请输入"></div><button class="primary">查询</button></div><div class="grid3" style="margin-top:18px">${projects.map((x,i)=>`<article class="card"><div class="project-banner ${i%3===1?"orange":i%3===2?"green":""}"></div><div class="inner"><b>${x}</b><p>2026.01.28 00:00　·　长期</p><footer><span>${i%3===0?"已结束":i%3===1?"已结项":"进行中"}</span><button class="secondary" data-action="toast">进入项目　›</button></footer></div></article>`).join("")}</div>`}</div></section>`)}
function live(){return wrap(`<div class="crumb">直播中心　/　我的直播</div><section class="shell"><div class="tabs"><h1 style="font-size:18px;margin:0;min-width:105px">我的直播</h1><button data-tab="0" class="${S.live===0?"on":""}">全部直播</button><button data-tab="1" class="${S.live===1?"on":""}">直播间</button></div><div class="appbody">${S.live===1?`<div class="strip"><b>直播间状态</b><span>全部　直播中　未开播</span></div><div class="grid3">${["测试直播间","周敏灵的直播间","产品情报局","光华运营说","周尊婵的直播间","产品需求评审会"].map((x,i)=>`<article class="panel"><h3>${x}</h3><p class="muted">直播间ID：00${25-i}</p><button class="secondary" data-action="toast">进入直播间</button></article>`).join("")}</div>`:`<div class="strip"><b>直播分类</b><span>全部　Monday直播　AI+数智化转型　光华运营说　产品情报局　产品赋能　需求评审　营销专区　其他</span><b>直播状态</b><span>全部　直播中　未开始　可回放　无回放　点播</span></div><div class="grid3" style="margin-top:18px">${lives.concat(lives.slice(0,3)).map((x,i)=>`<article class="item"><div class="live-thumb"></div><b>${x}</b><p>2026-09-${String(8-i%6).padStart(2,"0")} 14:00:00　·　${i%4?"可回放":"未开始"}</p><footer><span>${i%3?"0学时 · 0学分":"1学时 · 2学分"}</span><span>${i*8+3} 次访问</span></footer></article>`).join("")}</div>`}</div></section>`)}
function mapApp(){return wrap(`<div class="crumb">项目中心　/　我的地图</div><section class="shell"><div class="tabs"><h1 style="font-size:18px;margin:0">学习地图</h1></div><div class="appbody"><div class="strip"><b>项目年份</b><select class="select"><option>全部</option><option>2026</option></select><b>学习状态</b><span>全部　未完成　已完成</span><b>学习时间</b><span>下发日期　学习期限</span></div><div class="grid3" style="margin-top:18px">${["【DEMO】《活力前行：创新项目开启辉煌新征程》","新员工入职之——产品进阶-copy","南京人社项目模拟"].map((x,i)=>`<article class="panel"><h3>${x}</h3><p class="muted">学习进度：${["0%","25.00%","33.33%"][i]}</p><div class="bar"><i style="width:${[0,25,33][i]}%"></i></div><p class="muted">学习阶段：${[6,4,3][i]}个　·　课程数：${[6,38,4][i]}门　·　总学时：${[4.47,27.24,4.67][i]}学时</p><button class="primary" data-action="toast">进入学习</button></article>`).join("")}</div></div></section>`)}
function arrange(){return wrap(`<div class="crumb">项目中心　/　我的安排</div><section class="shell"><div class="tabs"><h1 style="font-size:18px;margin:0">安排课程</h1></div><div class="appbody"><div class="strip"><b>计划状态</b><span>全部　未完成　已完成</span><input class="select" placeholder="请选择年份"><input class="select" placeholder="请选择月份"></div><div class="list">${["2026年研发中心全流程自动化","年度必修课之职能"].map((x,i)=>`<article class="item"><b>${x}</b><p>2026-03-10 ~ 2026-04-30　·　${i?"已完成":"未完成"}</p><p>总课程数：${i?6:1}　总学分数：${i?10:.95}　总学时数：${i?10:.95}</p><div class="progress"><span>必修课</span><div class="bar"><i style="width:${i?100:0}%"></i></div><span>${i?"6/6":"0/1"}</span></div></article>`).join("")}</div></div></section>`)}
function appPage(title,body){return wrap(`<div class="crumb">更多　/　${title}</div><section class="shell"><div class="tabs"><h1 style="font-size:18px;margin:0">${title}</h1></div><div class="appbody">${body}</div></section>`)}
function simpleApps(){return wrap(`<div class="crumb">更多　/　全部应用</div><section class="shell body"><h1 style="margin:0 0 5px;font-size:20px">全部应用</h1><p class="muted">学习综合、社区互动、调研考试、消息资讯和其他平台应用</p><div class="apps">${Object.entries(APPS).map(([g,items])=>`<div class="group">${g}</div>${items.map((x,i)=>`<button class="app-tile" data-action="app"><div class="app-icon">${icon(["book","file","map","live","exam","star"][i%6])}</div><b>${x}</b></button>`).join("")}`).join("")}</div></section>`)}
function home(){return wrap(`<div class="crumb">首页</div><section class="shell body"><div class="hero"><h2>光华加油站</h2><p>让学习发生，让成长看得见</p></div><div class="section-head"><h2>最新课程</h2><a data-route="course">查看更多　›</a></div><div class="grid4">${courses.slice(0,4).map(courseCard).join("")}</div><div class="two"><article class="panel"><h3>我的待办</h3><div class="empty" style="min-height:170px"><div><b>☑</b><span>待完成 5 项　93%</span></div></div></article><article class="panel"><h3>最新直播</h3>${lives.slice(0,4).map((x,i)=>`<div class="error"><div class="num"><b>${i+1}</b></div><div class="main"><b>${x}</b><p>${i%2?"可回放":"未开始"}</p></div></div>`).join("")}</article></div></section>`)}
function render(){if(S.route!=="profile"&&S.route!=="team")S.route="profile";let b=S.route==="home"?home():S.route==="profile"?profile():S.route==="team"?teamPage():S.route==="course"?coursePage():S.route==="material"?material():S.route==="topic"?topicPage():S.route==="projects"?project():S.route==="live"?live():S.route==="map"?mapApp():S.route==="arrange"?arrange():S.route==="apps"?simpleApps():S.route==="exam"?appPage("考试中心",`<div class="pills"><button class="pill active">未完成</button><button class="pill">已完成</button></div><div class="empty"><div><b>✓</b><span>暂无数据</span></div></div>`):S.route==="error"?appPage("错题本",`<div class="pills"><button class="pill active">全部</button><button class="pill">考试</button><button class="pill">练习</button><button class="pill">竞赛</button></div>${["AI+数智化转型拿单策略应知应会","AI+数智化转型应知应会通关","2025年11月产品知识应知月考","新春知识竞赛——练习赛"].map((x,i)=>`<div class="error item"><div class="num"><b>${[35,115,2,7][i]}</b><span class="muted">错题数量</span></div><div class="main"><b>${x}</b><p>考试时间：2026-01-30 10:00 - 2026-02-12 17:00</p></div><button class="primary" data-action="toast">查看解析</button></div>`).join("")}`):S.route==="survey"?appPage("调查中心",`<div class="strip"><div class="searchbox"><input placeholder="调查名称"></div><b>状态</b><span>进行中　未开始　已完成　已过期</span></div><div class="list">${["问题征集：共筑更优智能服务","培训需求调研：课程内容满意度","学习平台使用反馈问卷"].map(x=>`<article class="item"><b>${x}</b><p>参与时间：2025-09-08 14:59 ~ 长期有效</p><button class="primary" data-action="toast">填写调查</button></article>`).join("")}</div>`):S.route==="assessment"?appPage("360评估中心",`<div class="pills"><button class="pill active">待填</button><button class="pill">已填</button><button class="pill">报告</button></div><div class="grid3" style="margin-top:18px">${["员工核心胜任力：问题解决、目标达成与学习创新360度评估","员工360度绩效评估问卷（对上级）_复制","消息提醒设置"].map((x,i)=>`<article class="item"><small style="color:var(--b)">360评估</small><b>${x}</b><p>结束时间：长期有效</p><p>题目数量：${[18,12,6][i]} 题</p><button class="primary" data-action="toast">填写问卷</button></article>`).join("")}</div>`):simpleApps();document.getElementById("app").innerHTML=b;let mv=document.querySelector(".source-map-canvas"),cn=mv&&mv.querySelector(".source-node.current");if(mv&&cn){let target=cn.querySelector(".source-map-person")||cn,vr=mv.getBoundingClientRect(),tr=target.getBoundingClientRect(),left=mv.scrollLeft+(tr.left+tr.width/2-vr.left)-mv.clientWidth/2,top=mv.scrollTop+(tr.top+tr.height/2-vr.top)-mv.clientHeight/2+80;mv.scrollLeft=Math.max(0,Math.min(left,mv.scrollWidth-mv.clientWidth));mv.scrollTop=Math.max(0,Math.min(top,mv.scrollHeight-mv.clientHeight))}}
document.addEventListener("click",e=>{let r=e.target.closest("[data-route]");if(r){S.route=r.dataset.route;S.more=false;S.menu="";render();scrollTo(0,0);return}let m=e.target.closest("[data-menu]");if(m){S.menu=S.menu===m.dataset.menu?"":m.dataset.menu;S.more=false;render();return}let p=e.target.closest("[data-profile]");if(p){S.route="profile";S.profile=+p.dataset.profile;S.mapDetail=null;S.detailTab=0;S.more=false;S.menu="";render();return}let node=e.target.closest("[data-position-node]");if(node){S.route="profile";S.profile=node.dataset.mapLevel==="1"?3:2;S.mapDetail={level:node.dataset.mapLevel==="1",index:+node.dataset.positionNode};S.detailTab=0;render();scrollTo(0,0);return}let detailTab=e.target.closest("[data-detail-tab]");if(detailTab){S.detailTab=+detailTab.dataset.detailTab;render();return}let planFilter=e.target.closest("[data-plan-filter]");if(planFilter){S.planCourseFilter=planFilter.dataset.planFilter;render();return}let mapBack=e.target.closest("[data-map-back]");if(mapBack){S.mapDetail=null;S.detailTab=0;render();scrollTo(0,0);return}let pv=e.target.closest("[data-project-view]");if(pv){S.route="profile";S.profile=6;S.projectView=+pv.dataset.projectView;render();scrollTo(0,0);return}let t=e.target.closest("[data-tab]");if(t){let n=+t.dataset.tab;if(S.route==="course")S.course=n;if(S.route==="material")S.material=n;if(S.route==="projects")S.project=n;if(S.route==="live")S.live=n;render();return}let a=e.target.closest("[data-action]");if(a){if(a.dataset.action==="more"){S.more=!S.more;S.menu="";render()}else if(a.dataset.action==="bell"){toast("暂无新的消息")}else if(a.dataset.action==="app"){toast("应用入口已记录，详情页待接入")}else toast("本地演示操作已触发")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.more||S.menu)){S.more=false;S.menu="";render()}});render();
</script>
</body>
</html>
