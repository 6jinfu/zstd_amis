<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人才发展 · 片头与片尾</title>
<style>
@font-face{font-family:"Source Han Sans SC";src:url("assets/SourceHanSansSC-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Source Han Sans SC";src:url("assets/SourceHanSansSC-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{font-family:"Source Han Sans SC";font-synthesis:none;-webkit-font-smoothing:antialiased}
#main{position:absolute;width:1728px;height:1117px;overflow:hidden;transform-origin:0 0;background:#fff}
#air{position:absolute;inset:0;width:1728px;height:1117px}
.part{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden}
.title-position{position:absolute;top:354px;left:0;right:0;text-align:center;transform-origin:50% 50%}
h1{margin:0;color:#0b5eff;font-size:148px;line-height:1.4;font-weight:700;letter-spacing:2px;white-space:nowrap}
.glyph-mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 3px 8px}
.glyph{display:inline-block;opacity:0;transform-origin:50% 80%;will-change:transform,opacity}
.detail{position:absolute;left:0;right:0;top:616px;text-align:center;margin:0;color:#0b5eff;font-size:52px;line-height:1.5;font-weight:500;white-space:nowrap}
.detail-mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 4px 8px}
.detail-text{display:inline-block;opacity:0;will-change:transform,opacity}
#white-cover{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:1}
</style>
</head>
<body>
<main id="main" data-composition-id="main" data-width="1728" data-height="1117" data-duration="10" data-fps="60">
<canvas id="air" class="clip" data-start="0" data-duration="10" data-track-index="0" aria-hidden="true"></canvas>
<section id="intro" class="part scene clip" data-start="0" data-duration="5" data-track-index="1" aria-label="人才发展片头">
<div class="title-position"><h1>人才发展</h1></div>
<p class="detail"><span class="detail-mask"><span class="detail-text">人才标准 · 评鉴盘点 · 学习方案</span></span></p>
</section>
<section id="outro" class="part scene clip" data-start="5" data-duration="5" data-track-index="1" aria-label="人才发展片尾">
<div class="title-position"><h1>人才发展</h1></div>
<p class="detail"><span class="detail-mask"><span class="detail-text">让岗位有标准，识人有依据，培养有方向</span></span></p>
</section>
<div id="white-cover"></div>
</main>
<script src="assets/gsap.min.js"></script>
<script src="assets/scene.js"></script>
<script>
const parts=[...document.querySelectorAll('.part')];
parts.forEach(part=>{const h=part.querySelector('h1'),text=h.textContent;h.setAttribute('aria-label',text);h.textContent='';for(const char of text){const mask=document.createElement('span'),glyph=document.createElement('span');mask.className='glyph-mask';glyph.className='glyph';glyph.textContent=char;glyph.setAttribute('aria-hidden','true');mask.appendChild(glyph);h.appendChild(mask);}});
const renderAir=window.createAirScene(document.getElementById('air'),{exit:false});
let current=0;
const clock={};
function draw(t){renderAir((t>=10?5:t%5)*1.2);}
Object.defineProperty(clock,'t',{get:()=>current,set:t=>{current=t;draw(t);},enumerable:true});
const tl=gsap.timeline({paused:true});
tl.to(clock,{t:10,duration:10,ease:'none'},0);
parts.forEach((part,i)=>{
 const start=i*5,selector='#'+part.id;
 tl.set(selector,{visibility:'visible',opacity:1,y:0},start);
 tl.to('#white-cover',{opacity:0,duration:.45,ease:'power2.out'},start);
 tl.fromTo(selector+' .glyph',{y:66,x:n=>-12+n*4,rotation:n=>-1.3+n*.4,opacity:0},{y:0,x:0,rotation:0,opacity:1,duration:.78,stagger:.05,ease:'power4.out',immediateRender:false},start+.35);
 tl.fromTo(selector+' .title-position',{y:12,scale:.98},{y:0,scale:1,duration:1.08,ease:'power3.out',immediateRender:false},start+.35);
 tl.fromTo(selector+' .detail-text',{y:40,x:-9,opacity:0},{y:0,x:0,opacity:1,duration:.65,ease:'power3.out',immediateRender:false},start+.92);
 if(i===0){tl.to(selector,{y:-15,opacity:0,duration:.32,ease:'power2.in'},4.28);tl.to('#white-cover',{opacity:1,duration:.45,ease:'power2.inOut'},4.55);tl.set(selector,{visibility:'hidden'},5);}
});
window.__timelines=window.__timelines||{};window.__timelines.main=tl;
window.seekIntroOutro=t=>{t=Math.max(0,Math.min(10,t));tl.pause().seek(t,false);draw(t);};
function fit(){const s=Math.min(innerWidth/1728,innerHeight/1117),e=document.getElementById('main');e.style.transform='scale('+s+')';e.style.left=(innerWidth-1728*s)/2+'px';e.style.top=(innerHeight-1117*s)/2+'px';}
addEventListener('resize',fit);fit();draw(0);
window.fontsReady=Promise.all([document.fonts.load('700 148px "Source Han Sans SC"','人才发展'),document.fonts.load('500 52px "Source Han Sans SC"',parts.map(p=>p.querySelector('.detail').textContent).join(''))]).then(()=>document.fonts.ready);
window.fontsReady.then(()=>{const p=new URLSearchParams(location.search);if(p.has('t'))window.seekIntroOutro(Number(p.get('t')));else if(matchMedia('(prefers-reduced-motion: reduce)').matches)window.seekIntroOutro(2);else if(location.protocol==='file:'||p.has('play'))tl.play(0);});
</script>
</body>
</html>
