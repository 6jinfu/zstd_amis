<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人才发展 · 动态片头</title>
<style>
@font-face{font-family:"Intro PingFang";src:local("PingFangSC-Semibold");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4ff}
body{font-family:"Intro PingFang",sans-serif;-webkit-font-smoothing:antialiased}
#main{position:absolute;left:0;top:0;width:1728px;height:1117px;overflow:hidden;transform-origin:0 0}
.scene{position:absolute;inset:0;overflow:hidden}
.backdrop{position:absolute;inset:-60px;background:radial-gradient(ellipse at 50% 48%,#fff 0%,#f8fbff 26%,#eaf2ff 56%,#d8e8ff 100%)}
.wash{position:absolute;inset:-100px;background:radial-gradient(ellipse at 93% 22%,rgba(130,179,250,.21),transparent 62%);opacity:.9}
.arcs{position:absolute;inset:0;width:1728px;height:1117px;opacity:.65}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 31% 23%,#fff 0%,#fff 14%,#f8fbff 43%,#eaf0fc 70%,#dce6f8 100%);box-shadow:inset -14px -18px 36px rgba(151,177,220,.065),0 12px 44px rgba(143,171,221,.055)}
.orb.small{width:88px;height:88px;left:306px;top:163px;opacity:.64}
.orb.top{width:216px;height:216px;left:1310px;top:169px;opacity:.92}
.orb.left{width:470px;height:470px;left:91px;top:906px;opacity:.8}
.orb.right{width:373px;height:373px;left:1568px;top:715px;opacity:.92}
.typography{position:absolute;left:110px;right:110px;top:397px;text-align:center;color:#0754dc}
h1{margin:0;font-size:84px;font-weight:600;line-height:1.32;letter-spacing:5px}
.headline{margin:40px 0 0;font-size:100px;font-weight:600;line-height:1.35;letter-spacing:2px;white-space:nowrap}
.char{display:inline-block;opacity:0;will-change:transform,opacity}
.phrase{display:inline-block}
@media(prefers-reduced-motion:reduce){.char{opacity:1!important;transform:none!important}.orb,.arcs,.wash,.backdrop{transform:none!important}}
</style>
</head>
<body>
<main id="main" data-composition-id="main" data-width="1728" data-height="1117" data-duration="8" data-fps="30">
<section id="intro-title" class="scene clip" data-start="0" data-duration="8" data-track-index="0" aria-label="人才发展片头">
<div class="backdrop"></div>
<div class="wash"></div>
<svg class="arcs" viewBox="0 0 1728 1117" fill="none" aria-hidden="true">
<circle cx="1358" cy="920" r="776" stroke="white" stroke-width="106" opacity=".56"/>
<circle cx="1358" cy="920" r="913" stroke="#b7c9e3" stroke-width="1.5" opacity=".28"/>
<circle cx="1358" cy="920" r="1091" stroke="#b7c9e3" stroke-width="1.5" opacity=".23"/>
<circle cx="1358" cy="920" r="1264" stroke="#b7c9e3" stroke-width="1.5" opacity=".18"/>
</svg>
<div class="orb small"></div><div class="orb top"></div><div class="orb left"></div><div class="orb right"></div>
<div class="typography">
<h1 aria-label="人才发展"><span class="char">人</span><span class="char">才</span><span class="char">发</span><span class="char">展</span></h1>
<p class="headline" aria-label="让人才成长，支撑业务发展"><span class="phrase first"></span><span class="phrase second"></span></p>
</div>
</section>
</main>
<script src="assets/gsap.min.js"></script>
<script>
const firstText="让人才成长，",secondText="支撑业务发展";
for(const [selector,value] of [[".first",firstText],[".second",secondText]]){
 const parent=document.querySelector(selector);
 for(const char of value){const span=document.createElement("span");span.className="char";span.textContent=char;parent.appendChild(span);}
}
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const tl=gsap.timeline({paused:true});
tl.fromTo("h1 .char",{opacity:0,y:24},{opacity:1,y:0,duration:.85,stagger:.13,ease:"power3.out"},.45);
tl.fromTo(".first .char",{opacity:0,y:30},{opacity:1,y:0,duration:.82,stagger:.10,ease:"power3.out"},1.38);
tl.fromTo(".second .char",{opacity:0,y:30},{opacity:1,y:0,duration:.82,stagger:.10,ease:"power3.out"},2.00);
tl.to(".orb.top",{x:-15,y:12,duration:8,ease:"sine.inOut"},0);
tl.to(".orb.small",{x:10,y:-14,duration:8,ease:"sine.inOut"},0);
tl.to(".orb.left",{x:20,y:-16,duration:8,ease:"sine.inOut"},0);
tl.to(".orb.right",{x:-21,y:13,duration:8,ease:"sine.inOut"},0);
tl.to(".arcs",{x:-10,y:-6,duration:8,ease:"sine.inOut"},0);
tl.to(".wash",{opacity:.64,duration:8,ease:"sine.inOut"},0);
window.__timelines=window.__timelines||{};
window.__timelines.main=tl;
window.seekIntro=seconds=>tl.pause().seek(Math.min(8,Math.max(0,seconds)),false);
function fit(){const scale=Math.min(innerWidth/1728,innerHeight/1117);const root=document.getElementById("main");root.style.transform="scale("+scale+")";root.style.left=(innerWidth-1728*scale)/2+"px";root.style.top=(innerHeight-1117*scale)/2+"px";}
addEventListener("resize",fit);fit();
const previewTime=new URLSearchParams(location.search).get("t");
if(previewTime!==null){window.seekIntro(Number(previewTime));}
else if(reduced){tl.pause().seek(8);}
else if(location.protocol==="file:"||new URLSearchParams(location.search).has("play")){tl.play(0);}
</script>
</body>
</html>
