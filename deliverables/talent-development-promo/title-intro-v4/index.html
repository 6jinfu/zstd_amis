<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人才发展 · 清透片头</title>
<style>
@font-face{font-family:"Intro PingFang";src:local("PingFangSC-Semibold");font-weight:600}
@font-face{font-family:"Intro PingFang";src:local("PingFangSC-Regular");font-weight:400}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f9ff}
body{font-family:"Intro PingFang",sans-serif;-webkit-font-smoothing:antialiased}
#main{position:absolute;width:1728px;height:1117px;overflow:hidden;transform-origin:0 0;background:#f5f9ff}
.scene{position:absolute;inset:0;overflow:hidden}
#air{position:absolute;inset:0;width:1728px;height:1117px}
.type-stage{position:absolute;inset:0}
.title-position{position:absolute;top:394px;left:0;right:0;text-align:center;transform-origin:50% 50%}
h1{margin:0;font-size:148px;line-height:1.38;font-weight:600;letter-spacing:7px;color:#0b5eff}
.glyph-mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 4px 8px}
.glyph{display:inline-block;transform-origin:50% 80%;will-change:transform,opacity;opacity:0}
.claim{position:absolute;left:0;right:0;top:619px;margin:0;text-align:center;font-size:53px;line-height:1.5;font-weight:400;letter-spacing:.5px;color:#0b5eff;white-space:nowrap}
.claim-mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 2px 8px}
.claim-text{display:inline-block;opacity:0;will-change:transform,opacity}
.end-light{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<main id="main" data-composition-id="main" data-width="1728" data-height="1117" data-duration="8" data-fps="60">
<section id="intro-title" class="scene clip" data-start="0" data-duration="8" data-track-index="0" aria-label="人才发展发布会片头">
<canvas id="air" width="1728" height="1117" aria-hidden="true"></canvas>
<div class="type-stage">
<div class="title-position"><h1 aria-label="人才发展"><span class="glyph-mask"><span class="glyph">人</span></span><span class="glyph-mask"><span class="glyph">才</span></span><span class="glyph-mask"><span class="glyph">发</span></span><span class="glyph-mask"><span class="glyph">展</span></span></h1></div>
<p class="claim" aria-label="让人才成长，支撑业务发展"><span class="claim-mask"><span class="claim-text first">让人才成长，</span></span><span class="claim-mask"><span class="claim-text second">支撑业务发展</span></span></p>
</div>
<div class="end-light"></div>
</section>
</main>
<script src="assets/gsap.min.js"></script>
<script src="assets/scene.js"></script>
<script>
const renderAir=window.createAirScene(document.getElementById("air"));
let current=0;
const clock={};
Object.defineProperty(clock,"t",{get:()=>current,set:t=>{current=t;renderAir(t);},enumerable:true});
const tl=gsap.timeline({paused:true});
tl.to(clock,{t:8,duration:8,ease:"none"},0);
tl.fromTo(".glyph",{y:78,x:i=>-16+i*5,rotation:i=>-2.5+i*.8,opacity:0},{y:0,x:0,rotation:0,opacity:1,duration:.93,stagger:.048,ease:"power4.out"},.82);
tl.fromTo(".title-position",{y:18,scale:.978},{y:0,scale:1,duration:1.35,ease:"power3.out"},.82);
tl.fromTo(".claim-text.first",{y:47,x:-12,opacity:0},{y:0,x:0,opacity:1,duration:.88,ease:"power3.out"},1.74);
tl.fromTo(".claim-text.second",{y:47,x:-8,opacity:0},{y:0,x:0,opacity:1,duration:.92,ease:"power3.out"},1.89);
tl.to(".type-stage",{y:-7,duration:.33,ease:"power2.inOut"},6.92);
tl.to(".type-stage",{opacity:0,y:-21,duration:.40,ease:"power2.in"},7.25);
tl.to(".end-light",{opacity:1,duration:.55,ease:"power2.inOut"},7.45);
window.__timelines=window.__timelines||{};
window.__timelines.main=tl;
window.seekIntro=t=>{t=Math.max(0,Math.min(8,t));tl.pause().seek(t,false);renderAir(t);};
function fit(){const s=Math.min(innerWidth/1728,innerHeight/1117),e=document.getElementById("main");e.style.transform="scale("+s+")";e.style.left=(innerWidth-1728*s)/2+"px";e.style.top=(innerHeight-1117*s)/2+"px";}
addEventListener("resize",fit);fit();renderAir(0);
const params=new URLSearchParams(location.search);
if(params.has("t"))window.seekIntro(Number(params.get("t")));
else if(matchMedia("(prefers-reduced-motion: reduce)").matches)window.seekIntro(5);
else if(location.protocol==="file:"||params.has("play"))tl.play(0);
</script>
</body>
</html>
