<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人才发展 · 灵动片头 V3</title>
<style>
@font-face{font-family:"Intro PingFang";src:local("PingFangSC-Semibold");font-weight:600}
@font-face{font-family:"Intro PingFang";src:local("PingFangSC-Regular");font-weight:400}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8fc}
body{font-family:"Intro PingFang",sans-serif;-webkit-font-smoothing:antialiased}
#main{position:absolute;width:1728px;height:1117px;overflow:hidden;transform-origin:0 0;background:#f5f8fc}
.scene{position:absolute;inset:0;overflow:hidden}
.backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 47% 42%,#fff 0%,#fff 20%,#f2f6fc 63%,#e3edf9 100%)}
.light-field{position:absolute;width:1900px;height:1400px;left:-150px;top:-150px;background:radial-gradient(ellipse at 72% 16%,rgba(159,194,247,.32),transparent 53%);opacity:0}
#ribbons{position:absolute;inset:0;width:1728px;height:1117px}
.text-field{position:absolute;left:0;top:0;width:1728px;height:1117px;background:radial-gradient(ellipse at 50% 48%,rgba(255,255,255,.84),rgba(255,255,255,.47) 27%,transparent 48%);opacity:0}
.type-stage{position:absolute;inset:0;perspective:1100px}
.title-position{position:absolute;top:397px;left:0;right:0;text-align:center;transform-origin:50% 55%}
h1{margin:0;font-size:150px;line-height:1.38;font-weight:600;letter-spacing:10px;color:#1459d9}
.glyph-mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 3px}
.glyph{display:inline-block;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.claim{position:absolute;left:0;right:0;top:614px;margin:0;text-align:center;font-size:58px;line-height:1.5;font-weight:400;letter-spacing:1px;color:#20334e;white-space:nowrap}
.claim-mask{display:inline-block;overflow:hidden;vertical-align:top}
.claim-text{display:inline-block;opacity:0;will-change:transform,opacity}
.claim .accent{color:#1459d9;font-weight:600}
.end-light{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<main id="main" data-composition-id="main" data-width="1728" data-height="1117" data-duration="8" data-fps="60">
<section id="intro-title" class="scene clip" data-start="0" data-duration="8" data-track-index="0" aria-label="人才发展发布会片头">
<div class="backdrop"></div><div class="light-field"></div>
<canvas id="ribbons" width="1728" height="1117" aria-hidden="true"></canvas>
<div class="text-field"></div>
<div class="type-stage">
<div class="title-position">
<h1 class="primary-title" aria-label="人才发展"><span class="glyph-mask"><span class="glyph">人</span></span><span class="glyph-mask"><span class="glyph">才</span></span><span class="glyph-mask"><span class="glyph">发</span></span><span class="glyph-mask"><span class="glyph">展</span></span></h1>
</div>
<p class="claim" aria-label="让人才成长，支撑业务发展"><span class="claim-mask"><span class="claim-text first">让<span class="accent">人才成长</span>，</span></span><span class="claim-mask"><span class="claim-text second">支撑<span class="accent">业务发展</span></span></span></p>
</div>
<div class="end-light"></div>
</section>
</main>
<script src="assets/three.min.js"></script>
<script src="assets/gsap.min.js"></script>
<script src="assets/scene.js"></script>
<script>
const renderRibbonFrame=window.createRibbonScene(document.getElementById("ribbons"));
let frameTime=0;
const clock={};
Object.defineProperty(clock,"t",{get:()=>frameTime,set:value=>{frameTime=value;renderRibbonFrame(value);},enumerable:true});
const tl=gsap.timeline({paused:true});
tl.to(clock,{t:8,duration:8,ease:"none"},0);
tl.fromTo(".light-field",{opacity:0,x:-70,y:50},{opacity:.85,x:50,y:-35,duration:2.3,ease:"power3.out"},0);
tl.to(".light-field",{x:-20,y:10,opacity:.60,duration:3.5,ease:"sine.inOut"},2.3);
tl.to(".light-field",{x:30,y:-15,opacity:.80,duration:1.3,ease:"sine.inOut"},5.8);
tl.fromTo(".text-field",{opacity:0},{opacity:1,duration:1.25,ease:"power2.out"},1.20);
tl.fromTo(".primary-title .glyph",{y:98,rotationX:14,rotationZ:2},{y:0,rotationX:0,rotationZ:0,duration:1.22,stagger:.085,ease:"elastic.out(1,0.72)"},1.32);
tl.fromTo(".primary-title .glyph",{opacity:0},{opacity:1,duration:.34,stagger:.085,ease:"power2.out",immediateRender:false},1.32);
tl.fromTo(".title-position",{y:28,scale:.97},{y:-25,scale:1,duration:1.48,ease:"power3.out"},1.32);
tl.fromTo(".claim-text.first",{y:68,opacity:0,rotationZ:.5},{y:0,opacity:1,rotationZ:0,duration:.84,ease:"back.out(1.18)"},2.60);
tl.fromTo(".claim-text.second",{y:68,opacity:0,rotationZ:.5},{y:0,opacity:1,rotationZ:0,duration:.84,ease:"back.out(1.18)"},2.78);
tl.to(".type-stage",{scale:1.006,y:-2,duration:1.5,ease:"sine.inOut"},3.70);
tl.to(".type-stage",{scale:1,y:0,duration:1.5,ease:"sine.inOut"},5.20);
tl.to(".type-stage",{opacity:0,y:-14,scale:1.015,duration:.55,ease:"power2.in"},7.20);
tl.to(".end-light",{opacity:1,duration:.64,ease:"power2.inOut"},7.36);
window.__timelines=window.__timelines||{};
window.__timelines.main=tl;
window.seekIntro=seconds=>{tl.pause().seek(Math.max(0,Math.min(8,seconds)),false);renderRibbonFrame(Math.max(0,Math.min(8,seconds)));};
function fit(){const scale=Math.min(innerWidth/1728,innerHeight/1117);const root=document.getElementById("main");root.style.transform="scale("+scale+")";root.style.left=(innerWidth-1728*scale)/2+"px";root.style.top=(innerHeight-1117*scale)/2+"px";}
addEventListener("resize",fit);fit();renderRibbonFrame(0);
const params=new URLSearchParams(location.search);
if(params.has("t")){window.seekIntro(Number(params.get("t")));}
else if(matchMedia("(prefers-reduced-motion: reduce)").matches){window.seekIntro(5.5);}
else if(location.protocol==="file:"||params.has("play")){tl.play(0);}
</script>
</body>
</html>
